<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Visual Novel Web Player</title>
  <style> 
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #050811;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 10px;
    }

    /* Khung màn hình game (Mặc định Ngang: 1920x1080 -> aspect-ratio 16/9) */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      max-height: 75vh;
      background-color: #000000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      overflow: hidden;
      margin: 0 auto;
      transition: aspect-ratio 0.3s ease, max-width 0.3s ease;
    }

    /* Khi chuyển sang chế độ Dọc: 1080x1920 -> aspect-ratio 9/16 */
    #game-container.portrait {
      aspect-ratio: 9 / 16;
      max-width: 420px;
      max-height: 85vh;
    }

    /* Khi ở chế độ Full màn hình */
    #game-container:fullscreen,
    #game-container:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      border-radius: 0;
      box-shadow: none;
      background-color: #000;
    }

    /* Ép tỷ lệ 1920x1080 (16:9) khi Full màn hình */
    #game-container:fullscreen.force-landscape,
    #game-container:-webkit-full-screen.force-landscape {
      aspect-ratio: 16 / 9 !important;
      width: 100vw !important;
      height: 56.25vw !important;
      max-height: 100vh !important;
      max-width: calc(100vh * 16 / 9) !important;
      margin: auto !important;
    }

    /* Ép tỷ lệ 1080x1920 (9:16) khi Full màn hình */
    #game-container:fullscreen.force-portrait,
    #game-container:-webkit-full-screen.force-portrait {
      aspect-ratio: 9 / 16 !important;
      height: 100vh !important;
      width: calc(100vh * 9 / 16) !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      margin: auto !important;
    }

    .game-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #layer-bg-img, #layer-bg-video { z-index: 1; display: none; }
    
    /* Mặc định - Màn hình Ngang (1920x1080): Bám sát mép ĐỈNH (top: 0) */
    #layer-character, #layer-character-buffer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      width: 100%;
      height: auto;
      object-fit: contain;
      object-position: top center;
      display: none;
      transform-origin: top center;
    }

    /* Màn hình Dọc (.portrait - 1080x1920): Bám sát mép ĐÁY (bottom: 0) */
    #game-container.portrait #layer-character, #game-container.portrait #layer-character-buffer {
      top: auto;
      bottom: 0;
      width: auto;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
      transform-origin: bottom center;
    }

    #layer-vfx { z-index: 3; pointer-events: none; display: none; }

    /* Nhân vật hiển thị ngay lập tức, không dùng hiệu ứng mờ dần. */
    #layer-character, #layer-character-buffer {
      opacity: 1;
    }

    #layer-character, #layer-character-buffer.character-exiting {
      pointer-events: none;
    }

    #dialogue-canvas {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      background-color: var(--dialogue-bg-color, rgba(5, 8, 17, 0.62));
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 10px 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: auto;
      gap: 4px;
    }

    #speaker-name {
      display: none !important;
    }

    #dialogue-text {
      font-size: clamp(1rem, 2.2vw, 1.6rem);
      line-height: 1.4;
      color: #ffffff;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: center;       
      -webkit-text-stroke: 0.8px #000000;
      paint-order: stroke fill;
      text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.9);
    }

    /* --- GIAO DIỆN MÀN HÌNH CHỜ LOAD TIẾN ĐỘ --- */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 8, 17, 0.92);
      z-index: 99;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #loading-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .loading-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #a855f7;
    }

    .loading-bar-bg {
      width: 80%;
      max-width: 400px;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }

    .loading-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      transition: width 0.15s ease;
    }

    .loading-status {
      font-size: 0.8rem;
      color: #cbd5e1;
      max-width: 80%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* ------------------------------------------- */

    #controls {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
    }

    .btn {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.96);
    }

    /* Thanh tua tiến độ kịch bản */
    #seek-panel {
      width: 100%; max-width: 1000px; margin-top: 10px; padding: 10px 14px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: rgba(15,23,42,.72); border: 1px solid rgba(168,85,247,.25);
      border-radius: 10px; color: #e2e8f0; font-size: .82rem;
    }
    #seek-panel input[type="range"] { flex: 1; min-width: 150px; accent-color: #a855f7; cursor: pointer; }
    #seek-position { min-width: 86px; text-align: center; font-variant-numeric: tabular-nums; color: #c4b5fd; }
    #seek-panel .btn { padding: 6px 10px; }
    @media (max-width:600px) { #seek-panel { gap:7px; padding:8px; } #seek-position { min-width:70px; } }

    #volume-controls {
      margin-top: 8px;
      display: flex;
      gap: 14px;
      font-size: 0.8rem;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1000px;
      width: 100%;
    }

    #volume-controls label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #volume-controls input[type="range"] {
      accent-color: #a855f7;
      width: 60px;
    }

    #character-voice-panel {
      margin-top: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #character-voice-panel h4 {
      font-size: 0.85rem;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }

    #character-voice-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 130px;
      overflow-y: auto;
    }

    .char-voice-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      gap: 8px;
      flex-wrap: wrap;
    }

    .char-voice-row label {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #cbd5e1;
    }

    .char-voice-row select, .char-voice-row input[type="range"] {
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 0.75rem;
      accent-color: #a855f7;
    }

    .char-voice-row select {
      max-width: 160px;
      text-overflow: ellipsis;
    }

    .char-voice-row input[type="range"] {
      width: 65px;
    }

    @media (max-width: 600px) {
      #dialogue-canvas { padding: 6px 12px; bottom: 6px; }
      #speaker-name { font-size: 0.8rem; }
      #dialogue-text { font-size: 0.85rem; }
      .btn { padding: 6px 10px; font-size: 0.78rem; }
      #volume-controls { gap: 8px; font-size: 0.72rem; }
      .char-voice-row { font-size: 0.7rem; }
      .char-voice-row select { max-width: 120px; }
    }
  
    /* Tùy chỉnh hiển thị lời thoại */
    #dialogue-text { font-size: var(--dialogue-font-size, clamp(1rem, 2.2vw, 1.6rem)); color: var(--dialogue-color, #fff); -webkit-text-stroke: var(--dialogue-stroke-width, 0.8px) var(--dialogue-stroke-color, #000); font-family: var(--dialogue-font-family, 'Segoe UI', sans-serif); }
    #dialogue-text .tts-word { transition: color .08s, background-color .08s; border-radius: 3px; }
    #dialogue-text .tts-word.active { color: var(--dialogue-highlight-color, #ffe66d); background: rgba(255,230,109,.16); }
    #dialogue-settings { width:100%; max-width:1000px; margin-top:8px; padding:12px 14px; background:rgba(15,23,42,.88); border:1px solid rgba(168,85,247,.3); border-radius:10px; color:#e2e8f0; display:flex; flex-direction:column; gap:10px; }
    #dialogue-settings h4 { font-size:.9rem; color:#c4b5fd; }
    .dialogue-settings-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:10px; }
    .dialogue-setting { display:flex; flex-direction:column; gap:5px; font-size:.78rem; color:#cbd5e1; min-width:0; }
    .dialogue-setting input[type="range"] { width:100%; accent-color:#a855f7; }
    .dialogue-setting input[type="color"], .dialogue-setting select { width:100%; min-height:30px; background:#1e293b; color:#fff; border:1px solid #475569; border-radius:5px; padding:4px; }
    .dialogue-setting .setting-value { color:#c4b5fd; }
    .dialogue-toggle { display:flex; align-items:center; gap:8px; font-size:.8rem; }
    .dialogue-toggle input { accent-color:#a855f7; }
    /* Giao diện ghi video */
    #record-status {
      display: none;
      color: #fecaca;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      padding: 7px 12px;
      border: 1px solid rgba(248, 113, 113, 0.45);
      background: rgba(127, 29, 29, 0.35);
      border-radius: 8px;
    }
    #record-status.active { display: inline-flex; align-items: center; gap: 7px; }
    #btn-record-start { background: linear-gradient(135deg, #dc2626, #f97316); }
    #btn-record-stop { background: #991b1b; }
    #game-container.is-recording { box-shadow: 0 0 0 2px rgba(248,113,113,.65); }
    @media (max-width: 600px) {
      #record-status { font-size: 0.72rem; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Khung hiển thị tiến độ tải Dữ liệu -->
    <div id="loading-overlay">
      <div class="loading-title" id="loading-title">⏳ Đang tải tài nguyên... (0%)</div>
      <div class="loading-bar-bg">
        <div class="loading-bar-fill" id="loading-bar-fill"></div>
      </div>
      <div class="loading-status" id="loading-status">Đang khởi tạo...</div>
    </div>

    <img id="layer-bg-img" class="game-layer" src="" alt="Background Image" />
    <video id="layer-bg-video" class="game-layer" autoplay muted loop playsinline></video>
    
    <!-- Sử dụng Video WebM trong suốt cho nhân vật -->
    <video id="layer-character" class="game-layer" autoplay muted loop playsinline></video>
    <video id="layer-character-buffer" class="game-layer" autoplay muted loop playsinline></video>
    
    <img id="layer-vfx" class="game-layer" src="" alt="VFX Overlay" />

    <div id="dialogue-canvas" style="display: none;">
      <div id="speaker-name"></div>
      <div id="dialogue-text"></div>
    </div>
  </div>

  <div id="controls">
    <input type="file" id="jsonFile" accept=".json" style="display: none;">
    <button class="btn" id="btn-import">📂 Import JSON</button>
    
    <button id="btn-record-start" class="btn" onclick="trinhPhat.startRecording()">📦 Xuất ZIP ảnh + âm thanh & chạy</button>
    <button id="btn-record-stop" class="btn" onclick="trinhPhat.stopRecording()" style="display:none;">⏹ Kết thúc & tải ZIP</button>
    <span id="record-status" aria-live="polite">🔴 Đang thu: 0 khung hình</span>
    <label class="btn" style="display:inline-flex;align-items:center;gap:6px;">🎞 FPS
      <select id="record-fps" style="background:#1e293b;color:#fff;border:1px solid #64748b;border-radius:5px;padding:3px 6px;">
        <option value="12">12</option><option value="24">24</option><option value="25">25</option>
        <option value="30" selected>30</option><option value="50">50</option><option value="60">60</option>
      </select>
    </label>
    <label class="btn" style="display:inline-flex;align-items:center;gap:6px;">🔊 Âm thanh
      <select id="record-audio-mode" style="background:#1e293b;color:#fff;border:1px solid #64748b;border-radius:5px;padding:3px 6px;">
        <option value="game" selected>Âm thanh game</option><option value="system">Âm thanh tab / hệ thống</option>
      </select>
    </label>
    <label class="btn" style="display:inline-flex;align-items:center;gap:6px;">🖼 JPG
      <select id="record-jpg-quality" style="background:#1e293b;color:#fff;border:1px solid #64748b;border-radius:5px;padding:3px 6px;">
        <option value="0.65">Nhẹ</option><option value="0.8" selected>Cân bằng</option><option value="0.92">Nét cao</option>
      </select>
    </label>
    <span id="record-progress" style="font-size:.78rem;color:#cbd5e1;">Ảnh JPG tuần tự + audio riêng trong ZIP</span>
    <button id="btn-play" class="btn" onclick="trinhPhat.batDau()">▶ Chạy kịch bản</button>
    <button id="btn-pause" class="btn" onclick="trinhPhat.tamDung()" style="display: none;">⏸ Tạm dừng</button>
    <button id="btn-stop" class="btn" onclick="trinhPhat.dung()">⏹ Dừng phát</button>
    
    <button id="btn-orientation" class="btn" onclick="trinhPhat.toggleOrientation()">📱 Tỷ lệ: 1920×1080</button>
    <button id="btn-fullscreen" class="btn" onclick="trinhPhat.toggleFullscreen()">⛶ Toàn màn hình</button>
  </div>

  <div id="seek-panel" aria-label="Điều khiển tiến độ kịch bản">
    <button class="btn" type="button" onclick="trinhPhat.tuaMotDoan(-1)">⏮ Lùi 1</button>
    <input id="seek-slider" type="range" min="0" max="0" value="0" step="1"
      aria-label="Tua đến lượt thoại" oninput="trinhPhat.capNhatViTriTua(this.value)"
      onchange="trinhPhat.tuaDen(this.value)">
    <span id="seek-position">0 / 0</span>
    <button class="btn" type="button" onclick="trinhPhat.tuaMotDoan(1)">Tiến 1 ⏭</button>
    <span id="progress-status" style="font-size:.78rem;color:#cbd5e1;width:100%;text-align:center;">Tiến độ được tự lưu trên thiết bị này.</span>
    <button class="btn" id="btn-resume-progress" type="button" style="display:none;" onclick="trinhPhat.tiepTucTienDo()">▶ Tiếp tục từ lượt đã lưu</button>
    <button class="btn" id="btn-clear-progress" type="button" onclick="trinhPhat.xoaTienDoPhat()">↺ Xóa tiến độ đã lưu</button>
  </div>

  <section id="dialogue-settings" aria-label="Cài đặt chữ thoại">
    <h4>💬 Tùy chỉnh chữ thoại</h4>
    <label class="dialogue-toggle"><input id="dialogue-visible" type="checkbox" checked onchange="trinhPhat.capNhatCaiDatThoai('visible', this.checked)"> Hiển thị khung thoại</label>
    <div class="dialogue-settings-grid">
      <label class="dialogue-setting">Cỡ chữ <span class="setting-value" id="dialogue-size-value">28 px</span><input id="dialogue-size" type="range" min="14" max="52" step="1" value="28" oninput="trinhPhat.capNhatCaiDatThoai('fontSize', this.value)"></label>
      <label class="dialogue-setting">Màu nền hộp thoại <input id="dialogue-bg-color" type="color" value="#050811" onchange="trinhPhat.capNhatCaiDatThoai('bgColor', this.value)"></label>
      <label class="dialogue-setting">Độ trong suốt nền <span class="setting-value" id="dialogue-bg-opacity-value">62%</span><input id="dialogue-bg-opacity" type="range" min="0" max="100" step="1" value="62" oninput="trinhPhat.capNhatCaiDatThoai('bgOpacity', this.value)"></label>
      <label class="dialogue-setting">Màu chữ <input id="dialogue-color" type="color" value="#ffffff" onchange="trinhPhat.capNhatCaiDatThoai('color', this.value)"></label>
      <label class="dialogue-setting">Màu viền (stroke) <input id="dialogue-stroke-color" type="color" value="#000000" onchange="trinhPhat.capNhatCaiDatThoai('strokeColor', this.value)"></label>
      <label class="dialogue-setting">Độ dày viền <span class="setting-value" id="dialogue-stroke-value">0.8 px</span><input id="dialogue-stroke-width" type="range" min="0" max="5" step="0.1" value="0.8" oninput="trinhPhat.capNhatCaiDatThoai('strokeWidth', this.value)"></label>
      <label class="dialogue-setting">Màu chữ đang đọc <input id="dialogue-highlight-color" type="color" value="#ffe66d" onchange="trinhPhat.capNhatCaiDatThoai('highlightColor', this.value)"></label>
      <label class="dialogue-setting">Font chữ
        <select id="dialogue-font" onchange="trinhPhat.capNhatCaiDatThoai('fontFamily', this.value)">
          <option value="'Segoe UI', sans-serif">Segoe UI</option><option value="Arial, sans-serif">Arial</option><option value="Tahoma, sans-serif">Tahoma</option><option value="Georgia, serif">Georgia</option><option value="'Times New Roman', serif">Times New Roman</option><option value="Verdana, sans-serif">Verdana</option><option value="system-ui, sans-serif">System UI</option>
        </select>
      </label>
      <label class="dialogue-setting">Hiệu ứng chữ
        <select id="dialogue-effect" onchange="trinhPhat.capNhatCaiDatThoai('effect', this.value)">
          <option value="typewriter">Chạy từng chữ (typewriter)</option><option value="tts">Tô từ theo TTS</option><option value="static">Hiện toàn bộ, đứng im</option>
        </select>
      </label>
    </div>
    <button class="btn" type="button" onclick="trinhPhat.datLaiCaiDatThoai()">↺ Đặt lại chữ thoại</button>
  </section>

  <div id="volume-controls">
    <label>
      🔊 BGM: 
      <input type="range" id="vol-bgm" min="0" max="1" step="0.05" value="0.3" oninput="trinhPhat.doiAmLuongBgm(this.value)">
    </label>
    <label>
      🔔 SFX: 
      <input type="range" id="vol-sfx" min="0" max="1" step="0.05" value="0.4" oninput="trinhPhat.doiAmLuongSfx(this.value)">
    </label>
    <label>
      🗣 TTS Vol: 
      <input type="range" id="vol-tts" min="0" max="1" step="0.05" value="1.0" oninput="trinhPhat.doiAmLuongTts(this.value)">
    </label>
  </div>

  <div id="character-voice-panel">
    <h4>🎙️ Cấu hình giọng đọc riêng theo nhân vật</h4>
    <div id="character-voice-list">
      <span style="color: #64748b; font-style: italic;">Chưa có kịch bản hoặc nhân vật nào được tải. Hãy Import JSON trước!</span>
    </div>
  </div>

  <audio id="audio-bgm" loop crossorigin="anonymous"></audio>
  <audio id="audio-sfx" crossorigin="anonymous"></audio>
  <audio id="audio-tts" crossorigin="anonymous"></audio>

  <script>
    class TrinhPhatKichBanWeb {
      constructor() {
        this.container = document.getElementById('game-container');
        this.layerBgImg = document.getElementById('layer-bg-img');
        this.layerBgVideo = document.getElementById('layer-bg-video');
        this.layerChar = document.getElementById('layer-character');
        this.layerCharBuffer = document.getElementById('layer-character-buffer');
        this.layerCharBuffer.style.display = 'none';
        this.layerVfx = document.getElementById('layer-vfx');
        this.dialogueCanvas = document.getElementById('dialogue-canvas');
        this.speakerText = document.getElementById('speaker-name');
        this.dialogueText = document.getElementById('dialogue-text');

        this.caiDatThoai = { ...this.caiDatThoaiMacDinh };

        this.audioSfx.volume = 0.4;
        this.ttsVolume = 1.0;

        this.boDemAnhNen = new Map();
        this.boDemHieuUng = new Map();

        this.duLieu = null;
        this.dangChay = false;
        this.dangTamDung = false;

        this.khoaLuuGiongNhanVat = 'vn-character-tts-settings';
        try {
          this.cauHinhGiongNhanVatDaLuu = JSON.parse(localStorage.getItem(this.khoaLuuGiongNhanVat) || '{}');
          if (!this.cauHinhGiongNhanVatDaLuu || typeof this.cauHinhGiongNhanVatDaLuu !== 'object' || Array.isArray(this.cauHinhGiongNhanVatDaLuu)) this.cauHinhGiongNhanVatDaLuu = {};

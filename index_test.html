        // Nếu file không tồn tại hoặc nội dung lỗi, giữ duLieu = null để dùng mẫu gốc trong batDau().
        this.taiKichBanMacDinhPromise = this.taiKichBanMacDinh();
        window.addEventListener('pagehide', () => this.luuTienDoPhat());
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') this.luuTienDoPhat(); });
      }

      taoMaKichBan(data) {
        const raw = JSON.stringify(data); let hash = 2166136261;
        for (let i = 0; i < raw.length; i++) { hash ^= raw.charCodeAt(i); hash = Math.imul(hash, 16777619); }
        return 'script-' + (hash >>> 0).toString(16);
      }

      napTienDoPhat() {
        const ds = this.duLieu?.danh_sach || this.duLieu?.KichBanToanBo || [];
        const status = document.getElementById('progress-status'), resume = document.getElementById('btn-resume-progress');
        if (!this.progressScriptId || !ds.length) return;
        try {
          const all = JSON.parse(localStorage.getItem(this.progressStorageKey) || '{}'), saved = all[this.progressScriptId];
          if (!saved || !Number.isInteger(saved.index) || saved.index < 0 || saved.index >= ds.length) {
            this.currentIndex = 0; this.playbackStarted = false;
            if (saved) { delete all[this.progressScriptId]; localStorage.setItem(this.progressStorageKey, JSON.stringify(all)); }
            if (status) status.textContent = 'Chưa có tiến độ đã lưu.'; if (resume) resume.style.display = 'none'; return;
          }
          this.currentIndex = saved.index; this.playbackStarted = true; this.capNhatThanhTua();
          if (status) status.textContent = 'Đã khôi phục lượt ' + (saved.index + 1) + '/' + ds.length + '.';
          if (resume) resume.style.display = 'inline-block';
        } catch (err) {
          this.currentIndex = 0; this.playbackStarted = false;
          try { const all = JSON.parse(localStorage.getItem(this.progressStorageKey) || '{}'); delete all[this.progressScriptId]; localStorage.setItem(this.progressStorageKey, JSON.stringify(all)); } catch (_) { try { localStorage.removeItem(this.progressStorageKey); } catch (_) {} }
          if (status) status.textContent = 'Không đọc được tiến độ, sẽ phát lại từ đầu.'; if (resume) resume.style.display = 'none';
          console.warn('Tiến độ lưu bị lỗi, bắt đầu lại từ đầu:', err);
        }
      }

      luuTienDoPhat() {
        const ds = this.duLieu?.danh_sach || this.duLieu?.KichBanToanBo || [];
        if (!this.progressScriptId || !ds.length || this.currentIndex >= ds.length) return;
        try {
          const all = JSON.parse(localStorage.getItem(this.progressStorageKey) || '{}');
          all[this.progressScriptId] = { index: Math.max(0, Math.min(this.currentIndex, ds.length - 1)), total: ds.length, savedAt: Date.now() };
          localStorage.setItem(this.progressStorageKey, JSON.stringify(all));
          const status = document.getElementById('progress-status'), resume = document.getElementById('btn-resume-progress');
          if (status) status.textContent = 'Đã tự lưu tại lượt ' + (this.currentIndex + 1) + '/' + ds.length + '.';
          if (resume) resume.style.display = this.currentIndex > 0 ? 'inline-block' : 'none';
        } catch (err) { console.warn('Không thể tự lưu tiến độ:', err); }
      }

      xoaTienDoPhat() {
        try { const all = JSON.parse(localStorage.getItem(this.progressStorageKey) || '{}'); if (this.progressScriptId) delete all[this.progressScriptId]; localStorage.setItem(this.progressStorageKey, JSON.stringify(all)); }
        catch (_) { localStorage.removeItem(this.progressStorageKey); }
        this.currentIndex = 0; this.playbackStarted = false; this.capNhatThanhTua();
        const status = document.getElementById('progress-status'), resume = document.getElementById('btn-resume-progress');
        if (status) status.textContent = 'Đã xóa tiến độ. Sẽ phát từ đầu.'; if (resume) resume.style.display = 'none';
      }

      tiepTucTienDo() {
        if (!this.duLieu) return;
        if (this.currentIndex <= 0 && this.progressScriptId) {
          try {
            const all = JSON.parse(localStorage.getItem(this.progressStorageKey) || '{}');
            const saved = all[this.progressScriptId];
            const ds = this.duLieu.danh_sach || this.duLieu.KichBanToanBo || [];
            if (saved && Number.isInteger(saved.index) && saved.index >= 0 && saved.index < ds.length) {
              this.currentIndex = saved.index;
              this.playbackStarted = true;
              this.capNhatThanhTua();
            }
          } catch (_) { this.xoaTienDoPhat(); return; }
        }
        if (this.currentIndex > 0) this.batDau();
      }

      docCaiDatThoai() {
        try {
          const saved = JSON.parse(localStorage.getItem('vn-dialogue-settings') || '{}');
          this.caiDatThoai = { ...this.caiDatThoaiMacDinh, ...saved };
        } catch (_) {}
        this.apDungCaiDatThoai();
      }

      apDungCaiDatThoai() {
        const s = this.caiDatThoai;
        const root = this.dialogueText;
        const bgHex = String(s.bgColor || '#050811').replace('#', '');
        const bgR = parseInt(bgHex.slice(0, 2), 16), bgG = parseInt(bgHex.slice(2, 4), 16), bgB = parseInt(bgHex.slice(4, 6), 16);
        const bgAlpha = Math.max(0, Math.min(100, Number(s.bgOpacity))) / 100;
        this.dialogueCanvas.style.backgroundColor = `rgba(${bgR}, ${bgG}, ${bgB}, ${bgAlpha})`;
        root.style.setProperty('--dialogue-font-size', `${s.fontSize}px`);
        root.style.setProperty('--dialogue-color', s.color);
        root.style.setProperty('--dialogue-stroke-color', s.strokeColor);
        root.style.setProperty('--dialogue-stroke-width', `${s.strokeWidth}px`);
        root.style.setProperty('--dialogue-highlight-color', s.highlightColor);
        root.style.setProperty('--dialogue-font-family', s.fontFamily);
        this.dialogueCanvas.style.display = s.visible ? (this.dialogueCanvas.dataset.hasDialogue === 'true' ? 'flex' : 'none') : 'none';
        const values = { 'dialogue-visible': s.visible, 'dialogue-bg-color': s.bgColor, 'dialogue-bg-opacity': s.bgOpacity, 'dialogue-size': s.fontSize, 'dialogue-color': s.color, 'dialogue-stroke-color': s.strokeColor, 'dialogue-stroke-width': s.strokeWidth, 'dialogue-highlight-color': s.highlightColor, 'dialogue-font': s.fontFamily, 'dialogue-effect': s.effect };
        Object.entries(values).forEach(([id,value]) => { const el=document.getElementById(id); if(el) el.type==='checkbox' ? el.checked=!!value : el.value=value; });
        const bgOpacityLabel=document.getElementById('dialogue-bg-opacity-value'); if(bgOpacityLabel) bgOpacityLabel.textContent=`${s.bgOpacity}%`;
        const sizeLabel=document.getElementById('dialogue-size-value'); if(sizeLabel) sizeLabel.textContent=`${s.fontSize} px`;
        const strokeLabel=document.getElementById('dialogue-stroke-value'); if(strokeLabel) strokeLabel.textContent=`${s.strokeWidth} px`;
      }

      capNhatCaiDatThoai(key, value) {
        if (!(key in this.caiDatThoai)) return;
        if (key === 'fontSize' || key === 'strokeWidth' || key === 'bgOpacity') value = Number(value);
        this.caiDatThoai[key] = value;
        try { localStorage.setItem('vn-dialogue-settings', JSON.stringify(this.caiDatThoai)); } catch (_) {}
        this.apDungCaiDatThoai();
      }

      datLaiCaiDatThoai() {
        this.caiDatThoai = { ...this.caiDatThoaiMacDinh };
        try { localStorage.removeItem('vn-dialogue-settings'); } catch (_) {}
        this.apDungCaiDatThoai();
      }

      hienThiTuDangDoc(text, charIndex) {
        const words = [...text.matchAll(/[\p{L}\p{N}_]+/gu)];
        if (!words.length) { this.dialogueText.textContent = text; return; }
        let html = '', cursor = 0, activeFound = false;
        for (const match of words) {
          const start = match.index, end = start + match[0].length;
          html += this.escapeHtmlThoai(text.slice(cursor, start));
          const active = charIndex >= start && charIndex < end;
          if (active) activeFound = true;
          html += `<span class="tts-word${active ? ' active' : ''}" data-start="${start}" data-end="${end}">${this.escapeHtmlThoai(match[0])}</span>`;
          cursor = end;
        }
        html += this.escapeHtmlThoai(text.slice(cursor));
        this.dialogueText.innerHTML = html;
        if (!activeFound && charIndex >= 0) {
          const next = [...this.dialogueText.querySelectorAll('.tts-word')].find(el => Number(el.dataset.start) >= charIndex);
          if (next) next.classList.add('active');
        }
      }

      escapeHtmlThoai(value) {
        return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      }

      async taiKichBanMacDinh() {
        this.hienLoading(true);
        await new Promise(resolve => requestAnimationFrame(() => resolve()));
        try {
          this.capNhatTienDoLoad(1, 'Đang tải kịch bản...');
          const response = await fetch('./ailahungthu.json', { cache: 'no-store' });
          if (!response.ok) throw new Error('Không tìm thấy ailahungthu.json');
          const data = await response.json();
          if (!data || !Array.isArray(data.danh_sach) || data.danh_sach.length === 0) throw new Error('ailahungthu.json không đúng cấu trúc hoặc không có lời thoại');
          this.duLieu = data;
          this.progressScriptId = this.taoMaKichBan(data);
          this.napTienDoPhat();
          this.quetVaKhoiTaoNhanVat();
          await this.taiTruocDuLieu();
          await this.chuanBiNhacNen();
          if (this.ttsSynth) this.danhSachVoices = this.ttsSynth.getVoices();
          this.capNhatThanhTua();
          this.capNhatTienDoLoad(100, 'Kịch bản và tài nguyên mở đầu đã sẵn sàng!');
          console.info('Đã tự động tải kịch bản và chuẩn bị tài nguyên mở đầu.');
        } catch (err) {
          this.duLieu = null;
          this.capNhatTienDoLoad(100, 'Không tải được kịch bản mặc định. Bạn vẫn có thể Import JSON.');
          console.warn('Không thể tải ailahungthu.json, sẽ dùng kịch bản mẫu gốc:', err);
        } finally {
          await new Promise(resolve => setTimeout(resolve, 250));
          this.hienLoading(false);
        }
      }

      capNhatTienDoLoad(phamtram, message) {
        const percent = Math.min(100, Math.max(0, Math.round(phamtram)));
        this.loadingTitle.innerText = `⏳ Đang tải tài nguyên... (${percent}%)`;
        this.loadingBarFill.style.width = `${percent}%`;
        if (message) {
          this.loadingStatus.innerText = message;
        }
      }

      hienLoading(show) {
        if (show) {
          this.capNhatTienDoLoad(0, "Bắt đầu tải kịch bản...");
          this.loadingOverlay.classList.add('active');
        } else {
          this.loadingOverlay.classList.remove('active');
        }
      }

      toggleOrientation() {
        this.isPortrait = !this.isPortrait;
        const btn = document.getElementById('btn-orientation');

        if (this.isPortrait) {
          this.container.classList.add('portrait');
          btn.innerText = "📱 Tỷ lệ: 1080×1920";
        } else {
          this.container.classList.remove('portrait');
          btn.innerText = "📱 Tỷ lệ: 1920×1080";
        }
      }

      layNgonNguMacDinh() {
        // Lấy ngôn ngữ ưu tiên của trình duyệt/thiết bị người dùng.
        const danhSachNgonNgu = navigator.languages || [];
        // Ưu tiên tiếng Việt nếu có trong danh sách ngôn ngữ trình duyệt.
        const tiengViet = danhSachNgonNgu.find(lang => /^vi(?:-|$)/i.test(lang)) ||
          (navigator.language && /^vi(?:-|$)/i.test(navigator.language) ? navigator.language : null);
        return tiengViet || danhSachNgonNgu[0] || navigator.language || 'vi-VN';
      }

      // Nhận diện ngôn ngữ từ nội dung thoại, không phụ thuộc ngôn ngữ thiết bị.
      phatHienNgonNguTuNoiDung(ds, tenNhanVat) {
        const vanBan = ds
          .filter(khung => (khung.nhan_vat || '').trim() === tenNhanVat)
          .map(khung => khung.noi_dung || '')
          .join(' ')
          .trim();

        if (!vanBan) return 'vi-VN';

        // Các hệ chữ có thể nhận diện khá chắc chắn bằng Unicode.
        if (/[\u3040-\u30ff]/.test(vanBan)) return 'ja-JP';
        if (/[\uac00-\ud7af]/.test(vanBan)) return 'ko-KR';
        if (/[\u0600-\u06ff]/.test(vanBan)) return 'ar-SA';
        if (/[\u0400-\u04ff]/.test(vanBan)) return 'ru-RU';

        // Có chữ Hán nhưng không có Hiragana/Katakana: ưu tiên tiếng Trung.
        if (/[\u4e00-\u9fff]/.test(vanBan)) return 'zh-CN';

        // Dấu và ký tự đặc trưng của tiếng Việt.
        if (/[ăâđêôơưĂÂĐÊÔƠƯáàảãạấầẩẫậắằẳẵặéèẻẽẹếềểễệíìỉĩịóòỏõọốồổỗộớờởỡợúùủũụứừửữựýỳỷỹỵ]/.test(vanBan)) {
          return 'vi-VN';
        }

        // Một số ngôn ngữ Latin có dấu đặc trưng.
        if (/[ñ¿¡]/i.test(vanBan)) return 'es-ES';
        if (/[ãõ]/i.test(vanBan)) return 'pt-PT';
        if (/[äöüß]/i.test(vanBan)) return 'de-DE';
        if (/[àâçéèêëîïôûùüÿœæ]/i.test(vanBan)) return 'fr-FR';

        // Văn bản Latin không có dấu đặc trưng: mặc định tiếng Anh.
        return 'en-US';
      }

      timGiongTheoNgonNgu(maNgonNgu) {
        if (!this.danhSachVoices || this.danhSachVoices.length === 0) return -1;
        const ma = (maNgonNgu || 'vi-VN').toLowerCase();
        let idx = this.danhSachVoices.findIndex(v => (v.lang || '').toLowerCase() === ma);
        if (idx === -1) {
          const nhom = ma.split('-')[0];
          idx = this.danhSachVoices.findIndex(v => (v.lang || '').toLowerCase().startsWith(nhom + '-'));
        }
        return idx;
      }

      khoiTaoTTS() {
        if (this.ttsSynth) {
          const capNhatVoices = () => {
            this.danhSachVoices = this.ttsSynth.getVoices();
            // Chọn giọng đọc khớp với ngôn ngữ thiết bị nếu trình duyệt có cung cấp.
            Object.values(this.cauHinhGiongNhanVat).forEach(cfg => {
              // Ưu tiên khôi phục đúng giọng bằng voiceURI; chỉ dò theo tên/ngôn ngữ khi cần.
              let idx = cfg.voiceURI ? this.danhSachVoices.findIndex(v => v.voiceURI === cfg.voiceURI) : -1;
              if (idx === -1 && cfg.voiceName) {
                idx = this.danhSachVoices.findIndex(v => v.name === cfg.voiceName && (!cfg.lang || v.lang === cfg.lang));
              }
              if (idx === -1) {
                const ma = (cfg.lang || this.ngonNguMacDinh).toLowerCase();
                idx = this.danhSachVoices.findIndex(v => (v.lang || '').toLowerCase() === ma);
                if (idx === -1) {
                  const nhom = ma.split('-')[0];
                  idx = this.danhSachVoices.findIndex(v => (v.lang || '').toLowerCase().startsWith(nhom + '-'));
                }
              }
              cfg.voiceIndex = idx;
              if (idx >= 0) {
                cfg.voiceURI = this.danhSachVoices[idx].voiceURI;
                cfg.voiceName = this.danhSachVoices[idx].name;
                cfg.lang = this.danhSachVoices[idx].lang || cfg.lang;
              }
            });
            if (this.duLieu && this.danhSachVoices.length > 0) {
              this.quetVaKhoiTaoNhanVat();
            }
          };

          capNhatVoices();
          if (this.ttsSynth.onvoiceschanged !== undefined) {
            this.ttsSynth.onvoiceschanged = capNhatVoices;
          }
        }
      }

      khoiTaoSuKienFile() {
        const btnImport = document.getElementById('btn-import');
        const fileInput = document.getElementById('jsonFile');

        btnImport.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (event) => this.importJSON(event));
      }

      khoiTaoSuKienDoubleTapFullscreen() {
        let lastTapTime = 0;
        this.container.addEventListener('touchend', (e) => {
          const currentTime = new Date().getTime();
          const tapLength = currentTime - lastTapTime;
          if (tapLength < 300 && tapLength > 0) {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            if (isFullscreen) {
              if (!this.dangChay || this.dangTamDung) {
                this.batDau();
              } else {
                this.tamDung();
              }
            }
            e.preventDefault();
          }
          lastTapTime = currentTime;
        });

        this.container.addEventListener('dblclick', () => {
          const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
          if (isFullscreen) {
            if (!this.dangChay || this.dangTamDung) {
              this.batDau();
            } else {
              this.tamDung();
            }
          }
        });
      }

      async chuanBiNhacNen() {
        if (!this.duLieu) return;
        const ds = this.duLieu.danh_sach || this.duLieu.KichBanToanBo || [];
        const firstScene = this.layKhungKeThua(this.currentIndex) || ds[0];
        const tenNhac = firstScene && (firstScene.am_thanh_nen || firstScene.bgm);
        if (!tenNhac || typeof tenNhac !== 'string' || !tenNhac.trim()) return;
        if (!this.audioBgm.src.includes(tenNhac.trim())) {
          this.audioBgm.src = `assets/AmThanh/Nen/${tenNhac.trim()}`;
          this.audioBgm.loop = true;
          this.audioBgm.preload = 'auto';
          this.audioBgm.load();
        }
        if (this.audioBgm.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) return;
        await new Promise(resolve => {
          let done = false;
          const finish = () => {
            if (done) return;
            done = true; clearTimeout(timer);
            this.audioBgm.removeEventListener('canplay', finish);
            this.audioBgm.removeEventListener('loadeddata', finish);
            this.audioBgm.removeEventListener('error', finish);
            resolve();
          };
          const timer = setTimeout(finish, 10000);
          this.audioBgm.addEventListener('canplay', finish, { once: true });
          this.audioBgm.addEventListener('loadeddata', finish, { once: true });
          this.audioBgm.addEventListener('error', finish, { once: true });
        });
      }

      kichHoatAmThanhMobile() {
        if (this.ttsSynth) {
          this.ttsSynth.resume();
          const dummy = new SpeechSynthesisUtterance('');
          this.ttsSynth.speak(dummy);
        }

        // Phát trực tiếp MP3 thật trong chính thao tác bấm của người dùng.
        // Không thay src bằng WAV im lặng, tránh làm mất nguồn nhạc của kịch bản.
        if (this.audioBgm.src && this.audioBgm.paused) {
          this.audioBgm.play().catch(err => {
            console.warn('Trình duyệt chưa cho phép phát BGM:', err);
          });
        }

        this.audioSfx.play().then(() => this.audioSfx.pause()).catch(() => {});
      }

      importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            this.duLieu = JSON.parse(e.target.result);
            this.progressScriptId = this.taoMaKichBan(this.duLieu);
            this.napTienDoPhat();
            this.hienLoading(true);
            this.quetVaKhoiTaoNhanVat();
            await this.taiTruocDuLieu();
            await this.chuanBiNhacNen();
            this.hienLoading(false);
            if (this.ttsSynth) this.danhSachVoices = this.ttsSynth.getVoices();
            alert(`✅ Đã import kịch bản thành công!\nTổng phân cảnh: ${this.duLieu.danh_sach ? this.duLieu.danh_sach.length : 0}`);
          } catch (err) {
            this.hienLoading(false);
            alert("❌ Lỗi phân tích cú pháp JSON: " + err.message);
          }
        };
        reader.readAsText(file);
      }

      quetVaKhoiTaoNhanVat() {
        if (!this.duLieu) return;
        const ds = this.duLieu.danh_sach || this.duLieu.KichBanToanBo || [];
        const setNhanVat = new Set();
        
        ds.forEach(khung => {
          if (khung.nhan_vat && khung.nhan_vat.trim() !== "") {
            setNhanVat.add(khung.nhan_vat.trim());
          }
        });

        setNhanVat.forEach(ten => {
          if (!this.cauHinhGiongNhanVat[ten]) {
            // Lần khởi tạo đầu tiên: lấy ngôn ngữ từ noi_dung của chính nhân vật.
            // Người dùng vẫn có thể đổi ngôn ngữ/giọng đọc sau trong bảng cấu hình.
            const ngonNguNoiDung = this.phatHienNgonNguTuNoiDung(ds, ten);
            const macDinh = {
              voiceIndex: this.timGiongTheoNgonNgu(ngonNguNoiDung),
              rate: 1.1,
              pitch: 1.0,
              lang: ngonNguNoiDung
            };
            // Khôi phục thiết lập TTS đã lưu riêng cho nhân vật này.
            this.cauHinhGiongNhanVat[ten] = {
              ...macDinh,
              ...(this.cauHinhGiongNhanVatDaLuu[ten] || {})
            };
          }
        });

        this.taoBangCauHinhNhanVat();
      }

      taoBangCauHinhNhanVat() {
        const container = document.getElementById('character-voice-list');
        container.innerHTML = '';

        const danhSachTen = Object.keys(this.cauHinhGiongNhanVat);
        if (danhSachTen.length === 0) {
          container.innerHTML = '<span style="color: #64748b; font-style: italic;">Không tìm thấy nhân vật nào có thoại trong kịch bản.</span>';
          return;
        }

        danhSachTen.forEach(ten => {
          const cfg = this.cauHinhGiongNhanVat[ten];
          
          let optionsHtml = '';
          const presetLangs = [
            { code: 'ja-JP', name: '🇯🇵 Tiếng Nhật (Japanese)' },
            { code: 'vi-VN', name: '🇻🇳 Tiếng Việt (Vietnamese)' },
            { code: 'en-US', name: '🇺🇸 Tiếng Anh (English)' },
            { code: 'ko-KR', name: '🇰🇷 Tiếng Hàn (Korean)' },
            { code: 'zh-CN', name: '🇨🇳 Tiếng Trung (Chinese)' }
          ];

          if (!presetLangs.some(lang => lang.code.toLowerCase() === this.ngonNguMacDinh.toLowerCase())) {
            presetLangs.unshift({
              code: this.ngonNguMacDinh,
              name: `🌐 Ngôn ngữ thiết bị (${this.ngonNguMacDinh})`
            });
          }

          presetLangs.forEach(lang => {
            const selected = (cfg.lang === lang.code) ? 'selected' : '';
            optionsHtml += `<option value="${lang.code}" ${selected}>${lang.name}</option>`;
          });

          if (this.danhSachVoices.length > 0) {
            this.danhSachVoices.forEach((v, idx) => {
              const selected = (cfg.voiceIndex === idx || (cfg.voiceURI && cfg.voiceURI === v.voiceURI)) ? 'selected' : '';
              optionsHtml += `<option value="${idx}" ${selected}>${v.name} (${v.lang})</option>`;
            });
          }

          const row = document.createElement('div');
          row.className = 'char-voice-row';
          row.innerHTML = `
            <span style="font-weight: bold; color: #a855f7; min-width: 70px;">${ten}</span>
            <label>Giọng: <select onchange="trinhPhat.doiGiongNhanVat('${ten}', 'voice', this.value)">${optionsHtml}</select></label>
            <label>Tốc độ: <span id="rate-val-${ten}">${cfg.rate}</span><input type="range" min="0" max="2.0" step="0.1" value="${cfg.rate}" oninput="trinhPhat.doiGiongNhanVat('${ten}', 'rate', this.value)"></label>
            <label>Cao độ: <span id="pitch-val-${ten}">${cfg.pitch}</span><input type="range" min="0" max="2.0" step="0.1" value="${cfg.pitch}" oninput="trinhPhat.doiGiongNhanVat('${ten}', 'pitch', this.value)"></label>
          `;
          container.appendChild(row);
        });
      }

      doiGiongNhanVat(tenNhanVat, loai, giaTri) {
        if (!this.cauHinhGiongNhanVat[tenNhanVat]) return;

        if (loai === 'voice') {
          if (isNaN(giaTri)) {
            this.cauHinhGiongNhanVat[tenNhanVat].lang = giaTri;
            const foundIdx = this.danhSachVoices.findIndex(v => v.lang.toLowerCase().includes(giaTri.toLowerCase().split('-')[0]));
            if (foundIdx !== -1) {
              this.cauHinhGiongNhanVat[tenNhanVat].voiceIndex = foundIdx;
            }
          } else {
            this.cauHinhGiongNhanVat[tenNhanVat].voiceIndex = parseInt(giaTri);
            if (this.danhSachVoices[giaTri]) {
              this.cauHinhGiongNhanVat[tenNhanVat].lang = this.danhSachVoices[giaTri].lang;
            }
          }
          const selectedVoice = this.danhSachVoices[this.cauHinhGiongNhanVat[tenNhanVat].voiceIndex];
          if (selectedVoice) {
            this.cauHinhGiongNhanVat[tenNhanVat].voiceURI = selectedVoice.voiceURI;
            this.cauHinhGiongNhanVat[tenNhanVat].voiceName = selectedVoice.name;
          }
        } else if (loai === 'rate') {
          this.cauHinhGiongNhanVat[tenNhanVat].rate = parseFloat(giaTri);
          document.getElementById(`rate-val-${tenNhanVat}`).innerText = giaTri;
        } else if (loai === 'pitch') {
          this.cauHinhGiongNhanVat[tenNhanVat].pitch = parseFloat(giaTri);
          document.getElementById(`pitch-val-${tenNhanVat}`).innerText = giaTri;
        }
        this.luuCauHinhGiongNhanVat();
      }

      luuCauHinhGiongNhanVat() {
        try {
          localStorage.setItem(this.khoaLuuGiongNhanVat, JSON.stringify(this.cauHinhGiongNhanVat));
        } catch (err) {
          console.warn('Không thể lưu cấu hình TTS theo nhân vật:', err);
        }
      }

      doiAmLuongBgm(val) { this.audioBgm.volume = parseFloat(val); }
      doiAmLuongSfx(val) { this.audioSfx.volume = parseFloat(val); }
      doiAmLuongTts(val) { this.ttsVolume = parseFloat(val); }

      async toggleFullscreen() {
        try {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (this.isPortrait) {
              this.container.classList.add('force-portrait');
              this.container.classList.remove('force-landscape');
            } else {
              this.container.classList.add('force-landscape');
              this.container.classList.remove('force-portrait');
            }

            if (this.container.requestFullscreen) await this.container.requestFullscreen();
            else if (this.container.webkitRequestFullscreen) await this.container.webkitRequestFullscreen();
            
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock(this.isPortrait ? 'portrait' : 'landscape').catch(() => {});
            }
          } else {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
            
            this.container.classList.remove('force-landscape', 'force-portrait');
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
          }
        } catch (e) { console.log(e); }
      }

      // Bộ tải trước đa định dạng: chỉ ưu tiên một cửa sổ cảnh gần hiện tại.
      async taiTruocDuLieu() {
        const ds = this.duLieu?.danh_sach || this.duLieu?.KichBanToanBo || [];
        if (!ds.length) return;
        await this.taiTruocCacCanh(this.currentIndex || 0, 3, true);
      }

      // Dựng lại trạng thái tài nguyên có tính kế thừa đến một lượt bất kỳ.
      // Các trường để trống sẽ dùng giá trị gần nhất đã khai báo ở những lượt trước.
      // Chỉ kế thừa nền và nhạc nền; hiệu ứng/SFX vẫn là tài nguyên riêng từng lượt.
      layKhungKeThua(index) {
        const ds = this.duLieu?.danh_sach || this.duLieu?.KichBanToanBo || [];
        if (!ds.length || index < 0 || index >= ds.length) return ds[index] || null;
        const resolved = { ...ds[index] };
        const timGiaTriGanNhat = keys => {
          for (let i = index; i >= 0; i--) {
            const scene = ds[i] || {};
            for (const key of keys) {
              const value = scene[key];
              if (typeof value === 'string' && value.trim()) return value.trim();
            }
          }
          return '';
        };
        resolved.anh_nen = timGiaTriGanNhat(['anh_nen', 'background']);
        resolved.am_thanh_nen = timGiaTriGanNhat(['am_thanh_nen', 'bgm']);
        return resolved;
      }

      layTaiNguyenCuaCanh(khung) {
        const assets = [];
        const add = (path, folder, kind) => {
          if (typeof path === 'string' && path.trim()) assets.push({ path: folder + path.trim(), kind, key: path.trim() });
        };
        const bg = khung.anh_nen || khung.background;
        const vfx = khung.anh_hieu_ung || khung.vfx;
        const bgm = khung.am_thanh_nen || khung.bgm;
        const sfx = khung.am_thanh_hieu_ung || khung.sfx;
        add(bg, 'assets/Nen/', this.isMediaVideo(bg || '') ? 'video' : 'image');
        add(vfx, 'assets/HieuUng/', this.isMediaVideo(vfx || '') ? 'video' : 'image');
        add(bgm, 'assets/AmThanh/Nen/', 'audio');
        add(sfx, 'assets/AmThanh/HieuUng/', 'audio');
        const character = khung.nhan_vat, expression = khung.bieu_cam || khung.expression;
        if (character && expression) assets.push({ path: 'assets/NhanVat/' + character + '/' + expression + '.webm', kind: 'character-video', key: character + '/' + expression });
        // Cho phép kịch bản mở rộng khai báo thêm tài nguyên tùy ý.
        const extra = khung.tai_nguyen || khung.assets || khung.resources;
        const collect = value => {
          if (typeof value === 'string' && /\.(json|png|jpe?g|gif|webp|avif|svg|bmp|mp4|webm|ogv|ogg|mov|m4v|mp3|wav|m4a|aac|flac|opus)(\?.*)?$/i.test(value)) {
            const path = value.startsWith('assets/') ? value : value;
            assets.push({ path, kind: 'auto', key: value });
          } else if (Array.isArray(value)) value.forEach(collect);
          else if (value && typeof value === 'object') Object.entries(value).forEach(([key, child]) => {
            if (/^(src|url|path|file|resource)$/i.test(key)) collect(child);
            else if (Array.isArray(child) || (child && typeof child === 'object')) collect(child);
          });
        };
        collect(extra);
        return assets;
      }

      async taiTruocCacCanh(startIndex, count = 3, showProgress = false) {
        const ds = this.duLieu?.danh_sach || this.duLieu?.KichBanToanBo || [];
        const unique = new Map();
        for (let i = startIndex; i < Math.min(ds.length, startIndex + count); i++) {
          for (const asset of this.layTaiNguyenCuaCanh(this.layKhungKeThua(i))) unique.set(asset.path, asset);
        }
        const tasks = [...unique.values()].filter(asset => asset.kind === 'character-video' ? !this.videoPreloadCache?.has(asset.path) : !this.preloadResourceCache?.has(asset.path));
        if (!tasks.length) { if (showProgress) this.capNhatTienDoLoad(100, 'Tài nguyên mở đầu đã có sẵn trong bộ nhớ đệm.'); return; }
        let completed = 0, cursor = 0;
        const worker = async () => {
          while (cursor < tasks.length) {
            const asset = tasks[cursor++];
            if (asset.kind === 'character-video') await this.chuanBiVideoNhanVat(asset.path);
            else await this.taiTruocTaiNguyen(asset);
            completed++;
            if (showProgress) this.capNhatTienDoLoad(Math.max(1, (completed / tasks.length) * 100), 'Đang chuẩn bị: ' + asset.path.split('/').pop());
          }
        };
        if (showProgress) this.capNhatTienDoLoad(0, 'Đang tải trước tài nguyên đa định dạng...');
        await Promise.all(Array.from({ length: Math.min(2, tasks.length) }, worker));
        if (showProgress) this.capNhatTienDoLoad(100, 'Đã chuẩn bị các cảnh đầu tiên.');
      }

      taiTruocTaiNguyen(asset) {
        if (!asset?.path) return Promise.resolve(false);
        if (!this.preloadResourceCache) this.preloadResourceCache = new Map();
        if (this.preloadResourceCache.has(asset.path)) return this.preloadResourceCache.get(asset.path).promise;
        const ext = asset.path.split('.').pop().toLowerCase();
        let element = null;
        const promise = new Promise(resolve => {
          let done = false;
          const finish = ok => {
            if (done) return;
            done = true; clearTimeout(timer);
            if (element) {
              element.removeEventListener('load', onReady);
              element.removeEventListener('loadeddata', onReady);
              element.removeEventListener('canplay', onReady);
              element.removeEventListener('loadedmetadata', onReady);
              element.removeEventListener('error', onError);
            }
            if (ok && element instanceof HTMLImageElement) {
              if (asset.path.startsWith('assets/Nen/')) this.boDemAnhNen.set(asset.key, element);
              if (asset.path.startsWith('assets/HieuUng/')) this.boDemHieuUng.set(asset.key, element);
            }
            resolve(ok);
          };
          const onReady = () => finish(true), onError = () => finish(false);
          const timer = setTimeout(() => finish(false), 10000);
          if (asset.kind === 'image' || /^(png|jpe?g|gif|webp|avif|svg|bmp)$/i.test(ext)) {
            element = new Image();
            element.addEventListener('load', onReady, { once: true });
            element.addEventListener('error', onError, { once: true });
            element.src = asset.path;
            if (element.complete && element.naturalWidth) finish(true);
          } else if (asset.kind === 'video' || /^(mp4|webm|ogv|ogg|mov|m4v)$/i.test(ext)) {
            element = document.createElement('video');
            element.preload = 'auto'; element.muted = true; element.playsInline = true;
            element.addEventListener('loadeddata', onReady, { once: true });
            element.addEventListener('canplay', onReady, { once: true });
            element.addEventListener('error', onError, { once: true });
            element.src = asset.path; element.load();
            if (element.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) finish(true);
          } else if (asset.kind === 'audio' || /^(mp3|wav|m4a|aac|flac|opus|oga)$/i.test(ext)) {
            element = new Audio();
            element.preload = 'auto';
            element.addEventListener('loadedmetadata', onReady, { once: true });
            element.addEventListener('canplay', onReady, { once: true });
            element.addEventListener('error', onError, { once: true });
            element.src = asset.path; element.load();
          } else {
            fetch(asset.path, { cache: 'force-cache' }).then(response => finish(response.ok)).catch(() => finish(false));
          }
        });
        this.preloadResourceCache.set(asset.path, { promise, element });
        // Giữ cache có giới hạn; không giữ hàng trăm video/audio trong RAM.
        while (this.preloadResourceCache.size > 12) {
          const [key, old] = this.preloadResourceCache.entries().next().value;
          if (key === asset.path) break;
          this.preloadResourceCache.delete(key);
          const media = old.element;
          if (media && (media instanceof HTMLMediaElement)) {
            try { media.pause(); media.removeAttribute('src'); media.load(); } catch (_) {}
          }
        }
        return promise;
      }

      isMediaVideo(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        return ['mp4', 'webm', 'ogg', 'mov'].includes(ext);
      }

      preloadImage(src, callback) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => { callback(img); resolve(); };
          img.onerror = () => resolve();
          img.src = src;
        });
      }

      // Tải trước video nhân vật kế tiếp trong lúc TTS của cảnh hiện tại đang đọc.
      chuanBiVideoNhanVat(src) {
        if (!src) return Promise.resolve();
        if (this.videoPreloadCache.has(src)) return this.videoPreloadCache.get(src).promise;
        const video = document.createElement('video'); video.preload = 'auto'; video.muted = true; video.playsInline = true; video.src = src;
        const promise = new Promise(resolve => {
          let done = false;
          const finish = ok => { if (done) return; done = true; clearTimeout(timer); video.removeEventListener('loadeddata', onReady); video.removeEventListener('canplay', onReady); video.removeEventListener('error', onError); resolve(ok); };
          const onReady = () => finish(true), onError = () => finish(false), timer = setTimeout(() => finish(false), 8000);
          video.addEventListener('loadeddata', onReady); video.addEventListener('canplay', onReady); video.addEventListener('error', onError); video.load();
          if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) finish(true);
        });
        this.videoPreloadCache.set(src, { video, promise });
        while (this.videoPreloadCache.size > 2) { const key = this.videoPreloadCache.keys().next().value, old = this.videoPreloadCache.get(key); this.videoPreloadCache.delete(key); try { old.video.removeAttribute('src'); old.video.load(); } catch (_) {} }
        return promise;
      }

      chuanBiVideoTiepTheo(generation) {
        if (generation !== this.playbackGeneration) return;
        const ds = this.duLieu?.danh_sach || this.duLieu?.KichBanToanBo || [];
        // Tái sử dụng bộ đệm video nhân vật chuyên dụng để chuyển cảnh không phải tải lại.
        for (let i = this.currentIndex + 1; i < Math.min(ds.length, this.currentIndex + 3); i++) {
          const scene = ds[i], name = scene.nhan_vat, expression = scene.bieu_cam || scene.expression;
          if (name && expression) this.chuanBiVideoNhanVat('assets/NhanVat/' + name + '/' + expression + '.webm');
        }
        // Đồng thời tải nền 3 cảnh kế tiếp: ảnh, video nền, âm thanh và tệp dữ liệu bổ sung.
        this.taiTruocCacCanh(this.currentIndex + 1, 3, false).catch(err => console.warn('Preload tài nguyên:', err));
      }

      // Chờ video có thể giải mã khung hình đầu tiên trước khi hiển thị/phát.
      choVideoSanSang(video, timeout = 15000) {
        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) return Promise.resolve();
        return new Promise(resolve => {
          let done = false;
          const finish = () => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            video.removeEventListener('loadeddata', finish);
            video.removeEventListener('canplay', finish);
            video.removeEventListener('error', finish);
            resolve();
          };
          const timer = setTimeout(finish, timeout);
          video.addEventListener('loadeddata', finish, { once: true });
          video.addEventListener('canplay', finish, { once: true });
          video.addEventListener('error', finish, { once: true });
        });
      }

      async batDau() {

        if (this.dangChay && !this.dangTamDung) return;

        if (this.ttsSynth) this.ttsSynth.resume();

        // Chờ kiểm tra file JSON và preload tài nguyên mở đầu hoàn tất trước khi phát.
        if (this.taiKichBanMacDinhPromise) {
          await this.taiKichBanMacDinhPromise;
          this.taiKichBanMacDinhPromise = null;
        }

        // Chỉ phát nhạc sau khi tài nguyên của cảnh mở đầu đã sẵn sàng.
        this.kichHoatAmThanhMobile();

        if (this.dangTamDung) {
          this.dangTamDung = false;
          document.getElementById('btn-pause').innerText = "⏸ Tạm dừng";
          if (this.audioBgm.paused) this.audioBgm.play().catch(()=>{});
          if (this.layerBgVideo.style.display === 'block') this.layerBgVideo.play().catch(()=>{});
          if (this.layerChar.style.display === 'block') this.layerChar.play().catch(()=>{});
          
          if (this.audioTts.src && this.audioTts.paused && this.ttsServerUrl) {
            this.audioTts.play().catch(() => {});
          } else if (this.ttsRemainingText && this.currentTtsResolve) {
            this.docVanBanBangTTS(this.currentSpeaker, this.ttsRemainingText, this.currentTtsResolve);
          }
          return;
        }

        if (!this.duLieu) {
          this.duLieu = {
            thoi_gian_cho_giua: 0.02,
            toc_do_go_chu: 0.03,
            danh_sach: [
              {
                nhan_vat: "An",
                bieu_cam: "binh_thuong",
                noi_dung: "Hãy bấm Import JSON để tải kịch bản của bạn vào nhé!",
                anh_nen: "bg_school.png",
                am_thanh_nen: "bgm_gentle.mp3"
              }
            ]
          };
          this.quetVaKhoiTaoNhanVat();
        }

        document.getElementById('btn-pause').style.display = 'inline-block';
        if (!this.playbackStarted) this.currentIndex = 0;
        this.playbackStarted = true;
        this.capNhatThanhTua();
        this.chayToanBo();
      }

      tamDung() {
        if (!this.dangChay) return;

        if (!this.dangTamDung) {
          this.dangTamDung = true;
          this.luuTienDoPhat();
          document.getElementById('btn-pause').innerText = "▶ Tiếp tục";
          if (this.ttsSynth) this.ttsSynth.cancel();
          this.audioTts.pause();

          this.audioBgm.pause();
          this.audioSfx.pause();
          if (this.layerBgVideo.style.display === 'block') this.layerBgVideo.pause();
          if (this.layerChar.style.display === 'block') this.layerChar.pause();
        } else {
          this.dangTamDung = false;
          document.getElementById('btn-pause').innerText = "⏸ Tạm dừng";
          if (this.audioBgm.play) this.audioBgm.play().catch(()=>{});
          if (this.layerBgVideo.style.display === 'block') this.layerBgVideo.play().catch(()=>{});
          if (this.layerChar.style.display === 'block') this.layerChar.play().catch(()=>{});

          if (this.audioTts.src && this.audioTts.paused && this.ttsServerUrl) {
            this.audioTts.play().catch(() => {});
          } else if (this.ttsRemainingText && this.currentTtsResolve) {
            this.docVanBanBangTTS(this.currentSpeaker, this.ttsRemainingText, this.currentTtsResolve);
          }
        }
      }

      capNhatThanhTua() {
        const slider = document.getElementById('seek-slider');
        const label = document.getElementById('seek-position');
        if (!slider || !label) return;
        const total = this.duLieu?.danh_sach?.length || this.duLieu?.KichBanToanBo?.length || 0;
        slider.max = String(Math.max(0, total - 1));
        if (!this.seekDragging) slider.value = String(Math.min(this.currentIndex, Math.max(0, total - 1)));
        label.textContent = total ? (Math.min(this.currentIndex + (this.dangChay ? 1 : 0), total) + ' / ' + total) : '0 / 0';
      }

      capNhatViTriTua(value) {
        const total = this.duLieu?.danh_sach?.length || this.duLieu?.KichBanToanBo?.length || 0;
        document.getElementById('seek-position').textContent = total ? (Number(value) + 1) + ' / ' + total : '0 / 0';
      }

      tuaMotDoan(delta) {
        const total = this.duLieu?.danh_sach?.length || this.duLieu?.KichBanToanBo?.length || 0;
        if (!total) return;
        this.tuaDen(Math.max(0, Math.min(total - 1, this.currentIndex + delta)));
      }

      tuaDen(value) {
        const ds = this.duLieu?.danh_sach || this.duLieu?.KichBanToanBo || [];
        if (!ds.length || this.isRecording) return;
        const target = Math.max(0, Math.min(ds.length - 1, Math.round(Number(value) || 0)));
        const wasPlaying = this.dangChay && !this.dangTamDung;
        const wasPaused = this.dangChay && this.dangTamDung;

        // Hủy lượt thoại/TTS đang chờ để không làm phát chồng lên nhau.
        this.playbackGeneration++;
        if (this.ttsSynth) this.ttsSynth.cancel();
        this.audioTts.pause();
        this.audioSfx.pause();
        clearInterval(this.hienChuInterval);
        if (this.currentTtsResolve) {
          const finish = this.currentTtsResolve;
          this.currentTtsResolve = null;
          finish();
        }
        this.ttsRemainingText = '';
        this.currentIndex = target;
        this.playbackStarted = true;
        this.seekDragging = false;
        this.luuTienDoPhat();
        this.capNhatThanhTua();

        if (wasPlaying) {
          this.dangTamDung = false;
          this.dangChay = true;
          this.chayToanBo();
        } else if (wasPaused) {
          this.dangChay = false;
          this.dangTamDung = false;
          document.getElementById('btn-pause').style.display = 'none';
          // Nút Chạy sẽ tiếp tục từ lượt vừa chọn.
        } else {
          this.dangChay = false;
          this.dangTamDung = false;
          this.xoaChu();
          this.xuLyKhung(this.layKhungKeThua(target), true, this.playbackGeneration).then(() => {
            // Chỉ hiển thị thử khung đã chọn; không tự đọc thoại khi đang dừng.
            if (this.ttsSynth) this.ttsSynth.cancel();
            this.audioTts.pause();
          });
        }
      }

      async chayToanBo() {
        this.dangChay = true;
        const generation = this.playbackGeneration;
        const ds = this.duLieu.danh_sach || this.duLieu.KichBanToanBo || [];
        this.capNhatThanhTua();
        
        while (this.currentIndex < ds.length) {
          if (!this.dangChay || generation !== this.playbackGeneration) break;
          while (this.dangTamDung) {
            await this.sleep(100);
            if (!this.dangChay) break;
          }
          if (!this.dangChay || generation !== this.playbackGeneration) break;

          const khung = this.layKhungKeThua(this.currentIndex);
          await this.xuLyKhung(khung, false, generation);
          if (generation !== this.playbackGeneration) break;

          this.currentIndex++;
          this.luuTienDoPhat();
          this.capNhatThanhTua();
        }

        if (generation !== this.playbackGeneration) return;
        if (this.currentIndex >= ds.length) {
          this.playbackStarted = false;
          try { const all = JSON.parse(localStorage.getItem(this.progressStorageKey) || '{}'); delete all[this.progressScriptId]; localStorage.setItem(this.progressStorageKey, JSON.stringify(all)); } catch (_) {}
          const status = document.getElementById('progress-status'), resume = document.getElementById('btn-resume-progress');
          if (status) status.textContent = 'Đã phát hết kịch bản.'; if (resume) resume.style.display = 'none';
        }
        this.dangChay = false;
        document.getElementById('btn-pause').style.display = 'none';
        this.capNhatThanhTua();
        this.xoaChu();
        // Tự kết thúc và tải video khi kịch bản phát hết.
        if (this.isRecording) this.stopRecording();
      }

      async choHieuUngNhanVat(className, duration) {
        const el = this.layerChar;
        el.classList.remove('character-entering', 'character-exiting');
        void el.offsetWidth;
        el.classList.add(className);
        await new Promise(resolve => {
          let finished = false;
          const done = () => {
            if (finished) return;
            finished = true;
            el.removeEventListener('animationend', onEnd);
            clearTimeout(fallback);
            resolve();
          };
          const onEnd = event => {
            if (event.target === el) done();
          };
          const fallback = setTimeout(done, duration + 100);
          el.addEventListener('animationend', onEnd);
        });
      }

      async xuLyKhung(khung, preview = false, generation = this.playbackGeneration) {
        if (generation !== this.playbackGeneration) return;
        this.xoaChuKhongAnCanvas();

        const anhNen = khung.anh_nen || khung.background;
        const nhanVat = khung.nhan_vat;
        const bieuCam = khung.bieu_cam || khung.expression;
        const anhHieuUng = khung.anh_hieu_ung || khung.vfx;
        const noiDung = khung.noi_dung;
        const amThanhNen = khung.am_thanh_nen || khung.bgm;
        const amThanhHieuUng = khung.am_thanh_hieu_ung || khung.sfx;

        if (anhNen && anhNen.trim() !== "") {
          if (this.isMediaVideo(anhNen)) {
            this.layerBgImg.style.display = 'none';
            if (!this.layerBgVideo.src.includes(anhNen)) {
              this.layerBgVideo.src = `assets/Nen/${anhNen}`;
              this.layerBgVideo.load();
            }
            await this.choVideoSanSang(this.layerBgVideo);
            if (generation !== this.playbackGeneration) return;
            this.layerBgVideo.style.display = 'block';
            await this.layerBgVideo.play().catch(()=>{});
          } else {
            this.layerBgVideo.style.display = 'none';
            const bgImg = this.boDemAnhNen.get(anhNen);
            if (bgImg) {
              this.layerBgImg.src = bgImg.src;
            } else {
              await new Promise(r => {
                this.layerBgImg.onload = r;
                this.layerBgImg.onerror = r;
                this.layerBgImg.src = `assets/Nen/${anhNen}`;
              });
            }
            this.layerBgImg.style.display = 'block';
          }
        }

        // Nhân vật: hiển thị ngay; khi đổi hoặc ẩn thì tắt ngay, không dùng hiệu ứng mờ dần.
        if (nhanVat && bieuCam && nhanVat.trim() !== "" && bieuCam.trim() !== "") {
          const videoPath = `assets/NhanVat/${nhanVat}/${bieuCam}.webm`;
          const currentSrc = this.layerChar.getAttribute('src') || '';
          const sameCharacterVideo = currentSrc.includes(videoPath);

          if (sameCharacterVideo) {
            await this.choVideoSanSang(this.layerChar);
            if (generation !== this.playbackGeneration) return;
            if (this.layerChar.paused) await this.layerChar.play().catch(()=>{});
            this.layerChar.style.display = 'block';
          } else {
            // Nạp nhân vật mới trên lớp video đang ẩn; giữ nguyên nhân vật cũ trong lúc chờ.
            const nextLayer = this.layerChar === document.getElementById('layer-character')
              ? this.layerCharBuffer : document.getElementById('layer-character');
            const warm = this.videoPreloadCache.get(videoPath);
            if (warm) await warm.promise;
            if (generation !== this.playbackGeneration) return;

            nextLayer.pause();
            nextLayer.style.display = 'none';
            nextLayer.src = videoPath;
            nextLayer.load();
            await this.choVideoSanSang(nextLayer);
            if (generation !== this.playbackGeneration) return;

            await nextLayer.play().catch(() => {});
            if (generation !== this.playbackGeneration) {
              nextLayer.pause();
              return;
            }

            // Chỉ đổi lớp sau khi video mới đã sẵn sàng phát, không để lộ nền trống.
            const previousLayer = this.layerChar;
            nextLayer.style.display = 'block';
            nextLayer.classList.remove('character-entering', 'character-exiting');
            nextLayer.style.opacity = '1';
            previousLayer.style.display = 'none';
            previousLayer.pause();
            previousLayer.classList.remove('character-entering', 'character-exiting');
            previousLayer.style.opacity = '1';
            this.layerChar = nextLayer;
            this.layerCharBuffer = previousLayer;
          }
        } else {
          this.layerChar.style.display = 'none';
          this.layerChar.pause();
          this.layerCharBuffer.style.display = 'none';
          this.layerCharBuffer.pause();
          this.layerChar.classList.remove('character-entering', 'character-exiting');
          this.layerCharBuffer.classList.remove('character-entering', 'character-exiting');
          this.layerChar.style.opacity = '1';
          this.layerCharBuffer.style.opacity = '1';
        }

        if (anhHieuUng && anhHieuUng.trim() !== "") {
          const vfxImg = this.boDemHieuUng.get(anhHieuUng);
          this.layerVfx.src = vfxImg ? vfxImg.src : `assets/HieuUng/${anhHieuUng}`;
          this.layerVfx.style.display = 'block';
        } else {
          this.layerVfx.style.display = 'none';
        }

        if (!preview) this.chuanBiVideoTiepTheo(generation);

        if (!preview && amThanhNen && amThanhNen.trim() !== "") {
          const bgmPath = `assets/AmThanh/Nen/${amThanhNen}`;
          if (!this.audioBgm.src.includes(amThanhNen)) {
            this.audioBgm.src = bgmPath;
            this.audioBgm.loop = true;
            this.audioBgm.load();
          }
          // Luôn thử phát nếu BGM đang dừng; tránh trường hợp lần đầu bị chặn
          // rồi lần sau không thử lại vì src đã trùng tên file.
          if (this.audioBgm.paused) {
            this.audioBgm.play().catch(err => {
              console.warn('Không thể phát nhạc nền:', err);
            });
          }
        }

        if (!preview && amThanhHieuUng && amThanhHieuUng.trim() !== "") {
          this.audioSfx.src = `assets/AmThanh/HieuUng/${amThanhHieuUng}`;
          this.audioSfx.play().catch(() => {});
        }

        if (noiDung && !preview) {
          this.hienLoiThoai(nhanVat, noiDung);
          this.currentSpeaker = nhanVat;
          this.ttsRemainingText = noiDung;
          
          await new Promise((resolve) => {
            this.currentTtsResolve = resolve;
            this.docVanBanBangTTS(nhanVat, noiDung, resolve);
          });
        } else if (!preview) {
          await this.sleep(1000);
        }

        if (!preview) {
          const thoiGianCho = (this.duLieu && this.duLieu.thoi_gian_cho_giua !== undefined) ? this.duLieu.thoi_gian_cho_giua : 0.02;
          await this.sleep(thoiGianCho * 1000);
        }
      }

      async docVanBanBangTTS(nhanVat, text, resolveCallback) {
        if (!text) { resolveCallback(); return; }
        const cfg = (nhanVat && this.cauHinhGiongNhanVat[nhanVat])
          ? this.cauHinhGiongNhanVat[nhanVat]
          : { voiceIndex: 0, rate: 1.1, pitch: 1.0, lang: this.ngonNguMacDinh };

        // Dùng giọng đọc có sẵn trong trình duyệt, không cần máy chủ bên ngoài.
        if (!this.ttsSynth) { resolveCallback(); return; }
        this.ttsSynth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = cfg.lang || 'vi-VN';
        if (cfg.voiceIndex >= 0 && this.danhSachVoices[cfg.voiceIndex]) utterance.voice = this.danhSachVoices[cfg.voiceIndex];
        utterance.volume = this.ttsVolume;
        utterance.rate = cfg.rate;
        utterance.pitch = cfg.pitch;
        utterance.onboundary = event => {
          if (event.name === 'word') {
            this.ttsRemainingText = text.substring(event.charIndex);
            if (this.caiDatThoai.effect === 'tts') this.hienThiTuDangDoc(text, event.charIndex);
          }
        };
        utterance.onend = utterance.onerror = () => {
          this.ttsRemainingText = '';
          if (this.caiDatThoai.effect === 'tts') this.dialogueText.querySelectorAll('.tts-word.active').forEach(el => el.classList.remove('active'));
          this.currentTtsResolve = null;
          resolveCallback();
        };
        this.ttsSynth.speak(utterance);
      }

      khoiTaoBoTronAmThanh() {
        if (this.audioContext && this.audioDestination) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) throw new Error('Trình duyệt không hỗ trợ Web Audio API.');
        this.audioContext = new AudioCtx();
        this.audioDestination = this.audioContext.createMediaStreamDestination();
        [this.audioBgm, this.audioSfx, this.audioTts].forEach(audio => {
          if (!audio.__vnSource) {
            const source = this.audioContext.createMediaElementSource(audio);
            const gain = this.audioContext.createGain();
            source.connect(gain);
            gain.connect(this.audioContext.destination);
            gain.connect(this.audioDestination);
            audio.__vnSource = source;
          }
        });
      }

      hienLoiThoai(ten, noiDung) {
        this.dialogueCanvas.dataset.hasDialogue = 'true';
        this.dialogueCanvas.style.display = this.caiDatThoai.visible ? 'flex' : 'none';
        if (ten && ten.trim() !== "") {
          this.speakerText.innerText = ten;
          this.speakerText.style.display = 'block';
        } else {
          this.speakerText.style.display = 'none';
        }
        clearInterval(this.hienChuInterval);
        this.dialogueText.textContent = '';
        if (this.caiDatThoai.effect === 'static' || this.caiDatThoai.effect === 'tts') {
          this.dialogueText.textContent = noiDung;
          return;
        }
        let idx = 0;
        const speed = Math.max(5, (this.duLieu ? this.duLieu.toc_do_go_chu : 0.03) * 1000);
        this.hienChuInterval = setInterval(() => {
          if (!this.dangTamDung && this.dangChay) {
            if (idx < noiDung.length) this.dialogueText.textContent += noiDung.charAt(idx++);
            else clearInterval(this.hienChuInterval);
          }
        }, speed);
      }

      xoaChuKhongAnCanvas() {
        clearInterval(this.hienChuInterval);
        this.dialogueText.innerText = '';
        this.speakerText.innerText = '';
        this.dialogueCanvas.dataset.hasDialogue = 'false';
      }

      xoaChu() {
        this.xoaChuKhongAnCanvas();
        this.dialogueCanvas.style.display = 'none';
      }

      dung() {
        this.luuTienDoPhat();
        this.playbackGeneration++;
        this.playbackStarted = false;
        this.dangChay = false;
        this.dangTamDung = false;
        this.ttsRemainingText = "";
        this.currentTtsResolve = null;
        document.getElementById('btn-pause').style.display = 'none';
        document.getElementById('btn-pause').innerText = "⏸ Tạm dừng";
        clearInterval(this.hienChuInterval);
        if (this.ttsSynth) this.ttsSynth.cancel();
        this.audioTts.pause();
        this.audioBgm.pause();
        this.audioSfx.pause();
        this.layerBgVideo.pause();
        this.layerChar.pause();
        this.xoaChu();
        this.currentIndex = 0;
        this.capNhatThanhTua();
        this.layerBgImg.style.display = 'none';
        this.layerBgVideo.style.display = 'none';
        this.layerChar.style.display = 'none';
        this.layerChar.pause();
        this.layerCharBuffer.style.display = 'none';
        this.layerCharBuffer.pause();
        this.layerChar.classList.remove('character-entering', 'character-exiting');
        this.layerCharBuffer.classList.remove('character-entering', 'character-exiting');
        this.layerChar.style.opacity = '1';
        this.layerCharBuffer.style.opacity = '1';
        this.layerVfx.style.display = 'none';
      }

      async startRecording() {
        if (this.isRecording) return;
        if (!window.MediaRecorder || !HTMLCanvasElement.prototype.toBlob) {
          alert('Trình duyệt chưa hỗ trợ xuất ảnh Canvas / MediaRecorder. Hãy thử Chrome, Edge hoặc Safari mới.');
          return;
        }
        if (this.dangChay || this.dangTamDung) {
          alert('Hãy dừng kịch bản hiện tại trước khi bắt đầu xuất.');
          return;
        }
        try {
          this.recordingFps = Number(document.getElementById('record-fps')?.value || 30);
          this.jpgQuality = Number(document.getElementById('record-jpg-quality')?.value || 0.8);
          this.audioMode = document.getElementById('record-audio-mode')?.value || 'game';
          this.khoiTaoBoTronAmThanh();
          await this.audioContext.resume();

          this.systemAudioStream = null;
          if (this.audioMode === 'system') {
            if (!navigator.mediaDevices?.getDisplayMedia) throw new Error('Trình duyệt này không hỗ trợ chọn chia sẻ tab/màn hình có âm thanh.');
            const shared = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            shared.getVideoTracks().forEach(track => track.stop());
            const tracks = shared.getAudioTracks();
            if (!tracks.length) {
              shared.getTracks().forEach(track => track.stop());
              throw new Error('Nguồn chia sẻ không cung cấp âm thanh. Hãy chọn tab có bật chia sẻ âm thanh hoặc chuyển sang “Âm thanh game”.');
            }
            this.systemAudioStream = shared;
            this.systemAudioSource = this.audioContext.createMediaStreamSource(new MediaStream(tracks));
            this.systemAudioSource.connect(this.audioDestination);
          }

          const portrait = this.container.classList.contains('portrait');
          const outWidth = portrait ? 1080 : 1920;
          const outHeight = portrait ? 1920 : 1080;
          this.recordingCanvas = document.createElement('canvas');
          this.recordingCanvas.width = outWidth;
          this.recordingCanvas.height = outHeight;
          const ctx = this.recordingCanvas.getContext('2d', { alpha: false });
          if (!ctx) throw new Error('Không tạo được Canvas 2D.');

          const drawImageCover = (img, x, y, w, h) => {
            if (!img || !img.complete || !img.naturalWidth) return;
            const scale = Math.max(w / img.naturalWidth, h / img.naturalHeight);
            const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
            ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
          };
          const drawVideo = (video, x, y, w, h, fit = 'contain') => {
            if (!video || video.readyState < 2 || !video.videoWidth || !video.videoHeight) return;
            const scale = fit === 'cover' ? Math.max(w / video.videoWidth, h / video.videoHeight) : Math.min(w / video.videoWidth, h / video.videoHeight);
            const dw = video.videoWidth * scale, dh = video.videoHeight * scale;
            ctx.drawImage(video, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
          };
          this.drawRecordingFrame = () => {
            const rect = this.container.getBoundingClientRect();
            const sx = outWidth / Math.max(1, rect.width), sy = outHeight / Math.max(1, rect.height);
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, outWidth, outHeight);
            if (this.layerBgVideo.style.display !== 'none' && this.layerBgVideo.style.display !== '') drawVideo(this.layerBgVideo, 0, 0, outWidth, outHeight, 'cover');
            else if (this.layerBgImg.style.display !== 'none' && this.layerBgImg.style.display !== '') drawImageCover(this.layerBgImg, 0, 0, outWidth, outHeight);
            if (this.layerChar.style.display !== 'none' && this.layerChar.style.display !== '') {
              const cr = this.layerChar.getBoundingClientRect();
              ctx.save();
              ctx.globalAlpha = Number.parseFloat(getComputedStyle(this.layerChar).opacity || '1');
              drawVideo(this.layerChar, (cr.left-rect.left)*sx, (cr.top-rect.top)*sy, cr.width*sx, cr.height*sy, 'contain');
              ctx.restore();
            }
            if (this.layerVfx.style.display !== 'none' && this.layerVfx.style.display !== '') drawImageCover(this.layerVfx, 0, 0, outWidth, outHeight);
            if (this.dialogueCanvas.style.display !== 'none') {
              const dr = this.dialogueCanvas.getBoundingClientRect(), x=(dr.left-rect.left)*sx, y=(dr.top-rect.top)*sy, w=dr.width*sx, h=dr.height*sy;
              ctx.save(); ctx.fillStyle=getComputedStyle(this.dialogueCanvas).backgroundColor || 'rgba(5,8,17,.62)'; ctx.beginPath();
              if (ctx.roundRect) ctx.roundRect(x,y,w,h,18); else ctx.rect(x,y,w,h); ctx.fill();
              const style=getComputedStyle(this.dialogueText), fs=parseFloat(style.fontSize)*sy;
              ctx.font=`${style.fontWeight||'400'} ${fs}px ${style.fontFamily||'sans-serif'}`;
              ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round'; ctx.lineWidth=Math.max(2,fs*.055);
              ctx.strokeStyle='#000'; ctx.fillStyle='#fff';
              const raw=this.dialogueText.innerText||'', maxW=w-48, lines=[]; let line='';
              for (const word of raw.split(/\\s+/)) { const test=line?line+' '+word:word; if(line&&ctx.measureText(test).width>maxW){lines.push(line);line=word;}else line=test; }
              if(line) lines.push(line);
              const lh=fs*1.4, sy0=y+h/2-((lines.length-1)*lh)/2;
              lines.forEach((t,i)=>{ctx.strokeText(t,x+w/2,sy0+i*lh,maxW);ctx.fillText(t,x+w/2,sy0+i*lh,maxW);});
              ctx.restore();
            }
          };

          this.frameBlobs = [];
          this.frameCount = 0;
          this.stopFrameCapture = false;
          this.audioChunks = [];
          const audioStream = this.audioDestination.stream;
          const audioMime = ['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t)) || '';
          this.audioRecorder = new MediaRecorder(audioStream, audioMime ? {mimeType:audioMime,audioBitsPerSecond:192000} : {audioBitsPerSecond:192000});
          this.audioRecorder.ondataavailable = e => { if(e.data?.size) this.audioChunks.push(e.data); };
          this.audioRecorder.onstop = async () => {
            try {
              const audioBlob = new Blob(this.audioChunks,{type:this.audioRecorder?.mimeType||'audio/webm'});
              await this.downloadRecordingZip(audioBlob, outWidth, outHeight);
            } catch(err) { console.error(err); alert('Không thể tạo ZIP: '+err.message); }
            finally { this.cleanupRecordingCapture(); this.resetRecordingUI(); }
          };
          this.audioRecorder.start(1000);
          this.isRecording = true;
          this.container.classList.add('is-recording');
          document.getElementById('btn-record-start').style.display='none';
          document.getElementById('btn-record-stop').style.display='inline-block';
          document.getElementById('record-status').classList.add('active');
          document.getElementById('record-progress').textContent='Đang chuẩn bị khung hình...';
          this.frameCapturePromise = this.captureJpgFrames();
          await this.batDau();
        } catch(err) {
          console.error('Không thể bắt đầu xuất ZIP:',err);
          this.stopFrameCapture = true;
          if(this.audioRecorder && this.audioRecorder.state!=='inactive') this.audioRecorder.stop();
          else { this.cleanupRecordingCapture(); this.resetRecordingUI(); }
          alert('Không thể bắt đầu: '+(err.message||err));
        }
      }

      async captureJpgFrames() {
        const interval=1000/this.recordingFps;
        let next=performance.now();
        while(!this.stopFrameCapture) {
          const now=performance.now();
          if(now>=next) {
            this.drawRecordingFrame();
            const blob=await new Promise(resolve=>this.recordingCanvas.toBlob(resolve,'image/jpeg',this.jpgQuality));
            if(blob) {
              this.frameBlobs.push(blob); this.frameCount++;
              const status=document.getElementById('record-status');
              if(status) status.textContent='🔴 Đang thu: '+this.frameCount.toLocaleString('vi-VN')+' khung hình';
              const progress=document.getElementById('record-progress');
              if(progress) progress.textContent='Đã tạo '+this.frameCount.toLocaleString('vi-VN')+' ảnh JPG';
            }
            next+=interval;
            if(next<performance.now()-interval) next=performance.now()+interval;
          } else await new Promise(resolve=>setTimeout(resolve,Math.min(8,next-now)));
        }
      }

      async stopRecording() {
        if(!this.isRecording) return;
        this.dangChay=false; this.dangTamDung=false; this.stopFrameCapture=true;
        this.ttsRemainingText=''; this.currentTtsResolve=null;
        if(this.ttsSynth) this.ttsSynth.cancel();
        this.audioTts.pause(); clearInterval(this.hienChuInterval);
        this.audioBgm.pause(); this.audioSfx.pause(); this.layerBgVideo.pause(); this.layerChar.pause(); this.xoaChu();
        if(this.frameCapturePromise) await this.frameCapturePromise;
        const status=document.getElementById('record-status');
        if(status) status.textContent='⏳ Đang đóng gói ZIP...';
        if(this.audioRecorder && this.audioRecorder.state!=='inactive') this.audioRecorder.stop();
      }

      async downloadRecordingZip(audioBlob, width, height) {
        if(!this.frameBlobs?.length) throw new Error('Không có khung hình nào được ghi.');
        const files=this.frameBlobs.map((blob,i)=>({name:'images/frame_'+String(i+1).padStart(6,'0')+'.jpg',blob}));
        if(audioBlob?.size) files.push({name:audioBlob.type.includes('mp4')?'audio.mp4':audioBlob.type.includes('ogg')?'audio.ogg':'audio.webm',blob:audioBlob});
        const meta='Visual Novel export\\nResolution: '+width+'x'+height+'\\nFPS: '+this.recordingFps+'\\nFrames: '+this.frameBlobs.length+'\\nAudio mode: '+this.audioMode+'\\nAudio format: '+(audioBlob?.type||'none')+'\\n';
        files.push({name:'metadata.txt',blob:new Blob([meta],{type:'text/plain;charset=utf-8'})});
        const zip=await this.createStoredZip(files);
        const url=URL.createObjectURL(zip), link=document.createElement('a');
        link.href=url; link.download='visual-novel-frames-'+new Date().toISOString().replace(/[:.]/g,'-')+'.zip';
        document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url),120000);
        const progress=document.getElementById('record-progress');
        if(progress) progress.textContent='Hoàn tất: '+files.length+' tệp trong ZIP.';
      }

      async createStoredZip(files) {
        const enc=new TextEncoder(), locals=[], centrals=[]; let offset=0;
        const crcTable=TrinhPhatKichBanWeb.crcTable || (TrinhPhatKichBanWeb.crcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})());
        const crc32=data=>{let c=0xffffffff;for(let i=0;i<data.length;i++)c=crcTable[(c^data[i])&255]^(c>>>8);return (c^0xffffffff)>>>0;};
        const dosDate=new Date(), time=(dosDate.getHours()<<11)|(dosDate.getMinutes()<<5)|(Math.floor(dosDate.getSeconds()/2)), date=((Math.max(1980,dosDate.getFullYear())-1980)<<9)|((dosDate.getMonth()+1)<<5)|dosDate.getDate();
        for(const file of files) {
          const name=enc.encode(file.name), data=new Uint8Array(await file.blob.arrayBuffer()), crc=crc32(data);
          const local=new Uint8Array(30+name.length), lv=new DataView(local.buffer);
          lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x0800,true);lv.setUint16(8,0,true);
          lv.setUint16(10,time,true);lv.setUint16(12,date,true);lv.setUint32(14,crc,true);lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,name.length,true);lv.setUint16(28,0,true);local.set(name,30);
          locals.push(local,data);
          const central=new Uint8Array(46+name.length), cv=new DataView(central.buffer);
          cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);
          cv.setUint16(12,time,true);cv.setUint16(14,date,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);
          cv.setUint16(28,name.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,offset,true);central.set(name,46);
          centrals.push(central); offset+=local.length+data.length;
        }
        const centralSize=centrals.reduce((s,a)=>s+a.length,0), end=new Uint8Array(22), ev=new DataView(end.buffer);
        ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,centralSize,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
        return new Blob([...locals,...centrals,end],{type:'application/zip'});
      }

      static crcTable = null;

      resetRecordingUI() {
        this.isRecording=false; this.mediaRecorder=null; this.audioRecorder=null;
        this.recordedChunks=[]; this.audioChunks=[]; this.frameBlobs=[];
        this.container.classList.remove('is-recording');
        document.getElementById('btn-record-start').style.display='inline-block';
        document.getElementById('btn-record-stop').style.display='none';
        document.getElementById('record-status').classList.remove('active');
      }

      cleanupRecordingCapture() {
        if(this.systemAudioSource) { try{this.systemAudioSource.disconnect();}catch(e){} this.systemAudioSource=null; }
        if(this.systemAudioStream) { this.systemAudioStream.getTracks().forEach(t=>t.stop()); this.systemAudioStream=null; }
        this.recordingCanvas=null; this.drawRecordingFrame=null;
      }

      sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }
    }

    const trinhPhat = new TrinhPhatKichBanWeb();
  </script>

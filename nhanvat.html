<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Frame Splitter & Background Remover</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #050811;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 800px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h2 {
      text-align: center;
      color: #a855f7;
      font-size: 1.3rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    input[type="file"], select, input[type="number"], input[type="text"] {
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.9rem;
      outline: none;
    }
    .time-range-group {
      display: flex;
      gap: 12px;
    }
    .time-range-group .form-group {
      flex: 1;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .checkbox-group input {
      accent-color: #a855f7;
      width: 18px;
      height: 18px;
    }
    video {
      width: 100%;
      max-height: 250px;
      background: #000;
      border-radius: 8px;
      object-fit: contain;
      display: none;
    }
    .btn {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      text-align: center;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
    }
    .btn-warning {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }

    /* Khung test mẫu 1 frame */
    #test-box {
      display: none;
      flex-direction: column;
      gap: 10px;
      background: rgba(0,0,0,0.4);
      padding: 12px;
      border-radius: 8px;
      border: 1px dashed #a855f7;
      align-items: center;
    }
    #testCanvas {
      max-width: 100%;
      max-height: 250px;
      border-radius: 6px;
      background: repeating-linear-gradient(45deg, #111, #111 10px, #222 10px, #222 20px);
      cursor: crosshair;
    }

    /* Progress bar */
    #progress-container {
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      transition: width 0.1s linear;
    }
    .progress-text {
      font-size: 0.8rem;
      text-align: center;
      color: #cbd5e1;
    }

    /* Khu vực Review toàn bộ */
    #review-section {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
    }
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .review-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
      max-height: 300px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .review-card {
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #475569;
    }
    .review-card img {
      width: 100%;
      height: 90px;
      object-fit: contain;
      background: repeating-linear-gradient(45deg, #111, #111 10px, #222 10px, #222 20px);
    }
    .review-card span {
      font-size: 0.75rem;
      padding: 4px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🎬 Cắt Video & Xóa Phông Chuyên Sâu</h2>

    <div class="form-group">
      <label>1. Chọn video nguồn:</label>
      <input type="file" id="videoFile" accept="video/*">
    </div>

    <video id="videoPreview" controls></video>

    <!-- Nút Render thử 1 frame tại vị trí đang xem -->
    <button class="btn btn-warning" id="btnTestFrame" style="display: none;">🧪 Render thử frame hiện tại để test xóa phông</button>

    <!-- Khung hiển thị test frame & click chọn màu phông sót -->
    <div id="test-box">
      <label style="color: #a855f7; font-weight: bold;">🖱️ Bấm trực tiếp vào vùng phông xanh bị sót trên ảnh dưới đây để trích màu xóa:</label>
      <canvas id="testCanvas"></canvas>
      <div id="sampleColorInfo" style="font-size: 0.85rem; color: #38bdf8;">Đã lấy màu mẫu mặc định (Góc trái trên)</div>
    </div>

    <div class="time-range-group" id="timeRangeGroup" style="display: none;">
      <div class="form-group">
        <label>Bắt đầu cắt từ (giây):</label>
        <input type="number" id="startTimeInput" min="0" step="0.1" value="0">
      </div>
      <div class="form-group">
        <label>Kết thúc tại (giây):</label>
        <input type="number" id="endTimeInput" min="0" step="0.1" value="0">
      </div>
    </div>

    <div class="form-group">
      <label>2. Tốc độ khung hình (FPS cần cắt):</label>
      <select id="fpsSelect">
        <option value="10">10 FPS (Nhanh, dung lượng nhẹ)</option>
        <option value="15" selected>15 FPS (Tiêu chuẩn mượt)</option>
        <option value="24">24 FPS (Mượt cao - Cinematic)</option>
        <option value="30">30 FPS (Rất mượt)</option>
      </select>
    </div>

    <div class="form-group">
      <label>3. Định dạng ảnh xuất ra:</label>
      <select id="formatSelect">
        <option value="image/png" selected>PNG (Hỗ trợ trong suốt tốt nhất)</option>
        <option value="image/jpeg">JPEG (Không hỗ trợ trong suốt)</option>
      </select>
    </div>

    <div class="form-group">
      <div class="checkbox-group">
        <input type="checkbox" id="removeBgCheck" checked>
        <label for="removeBgCheck" style="cursor:pointer; color:#fff; font-weight:600;">✨ Tự động xóa phông nền thông minh</label>
      </div>
    </div>

    <div class="time-range-group">
      <div class="form-group">
        <label>4a. Dung sai quét màu sót (Threshold):</label>
        <input type="number" id="thresholdInput" min="5" max="100" value="35" placeholder="Gợi ý: 30-45">
      </div>
      <div class="form-group">
        <label>4b. Độ xâm lấn gọt mép (px):</label>
        <input type="number" id="cropDepthInput" min="0" max="10" value="1" placeholder="Ví dụ: 1">
      </div>
    </div>

    <div class="time-range-group">
      <div class="form-group">
        <label>5a. Bán kính viền mờ (px):</label>
        <input type="number" id="blurPxInput" min="0" max="20" step="0.5" value="1" placeholder="Ví dụ: 1">
      </div>
      <div class="form-group">
        <label>5b. Cường độ mờ viền (%):</label>
        <input type="number" id="blurPercentInput" min="0" max="100" value="80" placeholder="Ví dụ: 80%">
      </div>
    </div>

    <div class="form-group">
      <label>6. Tên file ZIP xuất ra:</label>
      <input type="text" id="zipNameInput" value="character_animation_frames" placeholder="Nhập tên file zip...">
    </div>

    <button class="btn" id="btnProcess" disabled>🚀 Bắt đầu cắt & Trích xuất Toàn bộ</button>

    <div id="progress-container">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">Đang chuẩn bị...</div>
    </div>

    <!-- Khu vực Review kết quả trước khi tải ZIP -->
    <div id="review-section">
      <div class="review-header">
        <label style="font-weight: bold; color: #a855f7;" id="reviewTitle">👁️ Xem trước kết quả (0 frames):</label>
        <button class="btn btn-success" id="btnDownloadZip">📥 Tải xuống file ZIP</button>
      </div>
      <div class="review-grid" id="reviewGrid"></div>
    </div>
  </div>

  <audio id="audioHelper" style="display:none;"></audio>

  <script>
    const videoFile = document.getElementById('videoFile');
    const videoPreview = document.getElementById('videoPreview');
    const btnTestFrame = document.getElementById('btnTestFrame');
    const testBox = document.getElementById('test-box');
    const testCanvas = document.getElementById('testCanvas');
    const sampleColorInfo = document.getElementById('sampleColorInfo');

    const timeRangeGroup = document.getElementById('timeRangeGroup');
    const startTimeInput = document.getElementById('startTimeInput');
    const endTimeInput = document.getElementById('endTimeInput');
    const fpsSelect = document.getElementById('fpsSelect');
    const formatSelect = document.getElementById('formatSelect');
    const removeBgCheck = document.getElementById('removeBgCheck');
    const thresholdInput = document.getElementById('thresholdInput');
    const cropDepthInput = document.getElementById('cropDepthInput');
    const blurPxInput = document.getElementById('blurPxInput');
    const blurPercentInput = document.getElementById('blurPercentInput');
    const zipNameInput = document.getElementById('zipNameInput');
    const btnProcess = document.getElementById('btnProcess');
    
    const progressContainer = document.getElementById('progress-container');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progress-text');

    const reviewSection = document.getElementById('review-section');
    const reviewGrid = document.getElementById('reviewGrid');
    const reviewTitle = document.getElementById('reviewTitle');
    const btnDownloadZip = document.getElementById('btnDownloadZip');

    let videoUrl = '';
    let extractedFrames = [];
    
    // Lưu trữ màu được trích xuất thủ công (mặc định lấy góc trái trên)
    let customTargetColor = { r: -1, g: -1, b: -1 };

    videoFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      videoUrl = URL.createObjectURL(file);
      videoPreview.src = videoUrl;
      videoPreview.style.display = 'block';
      btnTestFrame.style.display = 'block';

      videoPreview.onloadedmetadata = () => {
        startTimeInput.value = 0;
        endTimeInput.value = videoPreview.duration.toFixed(1);
        timeRangeGroup.style.display = 'flex';
      };

      btnProcess.disabled = false;
      reviewSection.style.display = 'none';
      testBox.style.display = 'none';
      customTargetColor = { r: -1, g: -1, b: -1 };
    });

    // ✨ Nút Render thử 1 frame tại vị trí video đang dừng
    btnTestFrame.addEventListener('click', async () => {
      if (!videoPreview.src) return;

      const canvas = document.createElement('canvas');
      canvas.width = videoPreview.videoWidth || 1280;
      canvas.height = videoPreview.videoHeight || 720;
      const ctx = canvas.getContext('2d');

      ctx.drawImage(videoPreview, 0, 0, canvas.width, canvas.height);

      // Xử lý xóa phông thử nghiệm trên frame này
      xuLyXoaPhông(canvas, ctx);

      // Hiển thị lên khung test canvas nhỏ
      testCanvas.width = canvas.width;
      testCanvas.height = canvas.height;
      const testCtx = testCanvas.getContext('2d');
      testCtx.drawImage(canvas, 0, 0);

      testBox.style.display = 'flex';
      testBox.scrollIntoView({ behavior: 'smooth' });
    });

    // ✨ Click trực tiếp vào ảnh test để trích xuất màu sót
    testCanvas.addEventListener('click', (e) => {
      const rect = testCanvas.getBoundingClientRect();
      const scaleX = testCanvas.width / rect.width;
      const scaleY = testCanvas.height / rect.height;
      
      const x = Math.floor((e.clientX - rect.left) * scaleX);
      const y = Math.floor((e.clientY - rect.top) * scaleY);

      const testCtx = testCanvas.getContext('2d');
      const pixel = testCtx.getImageData(x, y, 1, 1).data;

      customTargetColor = { r: pixel[0], g: pixel[1], b: pixel[2] };
      sampleColorInfo.innerHTML = `✅ Đã trích màu tại tọa độ (${x}, ${y}) -> RGB(${pixel[0]}, ${pixel[1]}, ${pixel[2]}). Hãy bấm "Render thử" lại để kiểm tra!`;
      sampleColorInfo.style.color = '#10b981';
    });

    // Hàm chung xử lý thuật toán xóa phông (Flood-fill + Crop + Blur)
    function xuLyXoaPhông(canvas, ctx) {
      const removeBg = removeBgCheck.checked;
      const threshold = Math.max(1, parseInt(thresholdInput.value) || 35);
      const cropDepth = Math.max(0, parseInt(cropDepthInput.value) || 0);
      const blurPx = Math.max(0, parseFloat(blurPxInput.value) || 0);
      const blurPercent = Math.min(100, Math.max(0, parseFloat(blurPercentInput.value) || 0)) / 100;

      if (!removeBg) return;

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const width = canvas.width;
      const height = canvas.height;

      // Nếu người dùng đã trích màu thủ công thì lấy màu đó, bằng không lấy góc trái trên
      const targetR = customTargetColor.r !== -1 ? customTargetColor.r : data[0];
      const targetG = customTargetColor.g !== -1 ? customTargetColor.g : data[1];
      const targetB = customTargetColor.b !== -1 ? customTargetColor.b : data[2];

      const visited = new Uint8Array(width * height);
      const queue = [];

      for (let x = 0; x < width; x++) {
        queue.push(x, 0);
        queue.push(x, height - 1);
      }
      for (let y = 0; y < height; y++) {
        queue.push(0, y);
        queue.push(width - 1, y);
      }

      for (let x = Math.floor(width * 0.4); x < Math.floor(width * 0.6); x++) {
        queue.push(x, height - 10); 
      }

      let head = 0;
      while (head < queue.length) {
        const x = queue[head++];
        const y = queue[head++];
        
        if (x < 0 || x >= width || y < 0 || y >= height) continue;
        const idx = y * width + x;

        if (visited[idx]) continue;
        visited[idx] = 1;

        const pIdx = idx * 4;
        const r = data[pIdx];
        const g = data[pIdx + 1];
        const b = data[pIdx + 2];

        if (
          Math.abs(r - targetR) < threshold &&
          Math.abs(g - targetG) < threshold &&
          Math.abs(b - targetB) < threshold
        ) {
          data[pIdx + 3] = 0; 

          if (x > 0) queue.push(x - 1, y);
          if (x < width - 1) queue.push(x + 1, y);
          if (y > 0) queue.push(x, y - 1);
          if (y < height - 1) queue.push(x, y + 1);
        }
      }
      ctx.putImageData(imgData, 0, 0);

      // Gọt mép (Xâm lấn)
      if (cropDepth > 0) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = width;
        tempCanvas.height = height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(canvas, 0, 0);

        const srcPixels = ctx.getImageData(0, 0, width, height).data;
        const outPixels = tempCtx.getImageData(0, 0, width, height).data;

        for (let y = cropDepth; y < height - cropDepth; y++) {
          for (let x = cropDepth; x < width - cropDepth; x++) {
            const idx = (y * width + x) * 4;
            
            if (srcPixels[idx + 3] > 0) {
              let hasTransparentNeighbor = false;
              
              for (let dy = -cropDepth; dy <= cropDepth; dy++) {
                for (let dx = -cropDepth; dx <= cropDepth; dx++) {
                  const nIdx = ((y + dy) * width + (x + dx)) * 4;
                  if (srcPixels[nIdx + 3] === 0) {
                    hasTransparentNeighbor = true;
                    break;
                  }
                }
                if (hasTransparentNeighbor) break;
              }

              if (hasTransparentNeighbor) {
                outPixels[idx + 3] = 0; 
              }
            }
          }
        }
        ctx.putImageData(new ImageData(outPixels, width, height), 0, 0);
      }

      // Khử răng cưa viền
      if (blurPx > 0 && blurPercent > 0) {
        const sharpCanvas = document.createElement('canvas');
        sharpCanvas.width = width;
        sharpCanvas.height = height;
        const sharpCtx = sharpCanvas.getContext('2d');
        sharpCtx.drawImage(canvas, 0, 0);

        const blurCanvas = document.createElement('canvas');
        blurCanvas.width = width;
        blurCanvas.height = height;
        const blurCtx = blurCanvas.getContext('2d');
        blurCtx.filter = `blur(${blurPx}px)`;
        blurCtx.drawImage(canvas, 0, 0);

        const sharpData = sharpCtx.getImageData(0, 0, width, height);
        const blurData = blurCtx.getImageData(0, 0, width, height);
        const finalData = ctx.getImageData(0, 0, width, height);

        const sPix = sharpData.data;
        const bPix = blurData.data;
        const fPix = finalData.data;
        const edgeRadius = Math.ceil(blurPx);

        for (let y = edgeRadius; y < height - edgeRadius; y++) {
          for (let x = edgeRadius; x < width - edgeRadius; x++) {
            const idx = (y * width + x) * 4;

            if (sPix[idx + 3] > 0) {
              let isEdge = false;
              for (let dy = -edgeRadius; dy <= edgeRadius; dy++) {
                for (let dx = -edgeRadius; dx <= edgeRadius; dx++) {
                  const nIdx = ((y + dy) * width + (x + dx)) * 4;
                  if (sPix[nIdx + 3] === 0) {
                    isEdge = true;
                    break;
                  }
                }
                if (isEdge) break;
              }

              if (isEdge) {
                fPix[idx]     = sPix[idx]     * (1 - blurPercent) + bPix[idx]     * blurPercent;
                fPix[idx + 1] = sPix[idx + 1] * (1 - blurPercent) + bPix[idx + 1] * blurPercent;
                fPix[idx + 2] = sPix[idx + 2] * (1 - blurPercent) + bPix[idx + 2] * blurPercent;
                fPix[idx + 3] = sPix[idx + 3] * (1 - blurPercent) + bPix[idx + 3] * blurPercent;
              }
            }
          }
        }
        ctx.putImageData(finalData, 0, 0);
      }
    }

    // Bắt đầu cắt toàn bộ video
    btnProcess.addEventListener('click', async () => {
      const fps = parseInt(fpsSelect.value);
      const format = formatSelect.value;
      const startTime = Math.max(0, parseFloat(startTimeInput.value) || 0);
      const ext = format === 'image/png' ? 'png' : 'jpg';

      btnProcess.disabled = true;
      reviewSection.style.display = 'none';
      progressContainer.style.display = 'flex';
      progressFill.style.width = '0%';
      progressText.innerText = 'Đang đọc thông tin video...';

      const vid = document.createElement('video');
      vid.src = videoUrl;
      vid.muted = true;
      
      await new Promise((resolve) => {
        vid.onloadedmetadata = () => resolve();
      });

      const videoDuration = vid.duration;
      const endTime = Math.min(videoDuration, parseFloat(endTimeInput.value) || videoDuration);
      
      if (startTime >= endTime) {
        alert("⚠️ Thời gian bắt đầu phải nhỏ hơn thời gian kết thúc!");
        btnProcess.disabled = false;
        progressContainer.style.display = 'none';
        return;
      }

      const interval = 1 / fps;
      const totalFrames = Math.floor((endTime - startTime) * fps);

      const canvas = document.createElement('canvas');
      canvas.width = vid.videoWidth || 1280;
      canvas.height = vid.videoHeight || 720;
      const ctx = canvas.getContext('2d');

      extractedFrames = [];
      let currentTime = startTime;
      let frameIndex = 1;

      while (currentTime <= endTime) {
        vid.currentTime = currentTime;
        
        await new Promise((resolve) => {
          const onSeeked = () => {
            vid.removeEventListener('seeked', onSeeked);
            setTimeout(resolve, 30);
          };
          vid.addEventListener('seeked', onSeeked);
        });

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);

        // Kiểm tra frame trống
        const checkData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let isEmptyFrame = true;
        for (let i = 3; i < checkData.length; i += 4 * 100) {
          if (checkData[i] > 10 && (checkData[i-1] < 240 || checkData[i-2] < 240 || checkData[i-3] < 240)) {
            isEmptyFrame = false;
            break;
          }
        }

        if (isEmptyFrame && frameIndex === 1) {
          currentTime += interval;
          continue;
        }

        // Gọi hàm xóa phông chuẩn chỉnh
        xuLyXoaPhông(canvas, ctx);

        const dataUrl = canvas.toDataURL(format, 0.9);
        const base64Data = dataUrl.replace(/^data:image\/(png|jpeg);base64,/, "");
        
        extractedFrames.push({
          name: `${frameIndex}.${ext}`,
          base64: base64Data,
          dataUrl: dataUrl
        });

        const percent = Math.min(100, Math.round(((currentTime - startTime) / (endTime - startTime)) * 100));
        progressFill.style.width = `${percent}%`;
        progressText.innerText = `Đang trích xuất frame: ${frameIndex} (${percent}%)`;

        currentTime += interval;
        frameIndex++;
      }

      progressContainer.style.display = 'none';
      btnProcess.disabled = false;
      hienThiReview();
    });

    function hienThiReview() {
      reviewGrid.innerHTML = '';
      reviewTitle.innerText = `👁️ Xem trước kết quả (${extractedFrames.length} frames):`;

      extractedFrames.forEach(frame => {
        const card = document.createElement('div');
        card.className = 'review-card';
        card.innerHTML = `
          <img src="${frame.dataUrl}" alt="${frame.name}">
          <span>${frame.name}</span>
        `;
        reviewGrid.appendChild(card);
      });

      reviewSection.style.display = 'flex';
      reviewSection.scrollIntoView({ behavior: 'smooth' });
    }

    btnDownloadZip.addEventListener('click', async () => {
      if (extractedFrames.length === 0) return;

      const zipName = zipNameInput.value.trim() || 'character_animation_frames';
      btnDownloadZip.disabled = true;
      btnDownloadZip.innerText = '⏳ Đang nén file ZIP...';

      const zip = new JSZip();
      const folder = zip.folder("frames");

      extractedFrames.forEach(frame => {
        folder.file(frame.name, frame.base64, { base64: true });
      });

      const content = await zip.generateAsync({ type: "blob" });
      const finalZipName = zipName.endsWith('.zip') ? zipName : `${zipName}.zip`;
      saveAs(content, finalZipName);

      btnDownloadZip.disabled = false;
      btnDownloadZip.innerText = '📥 Tải xuống file ZIP';
    });
  </script>
</body>
</html>

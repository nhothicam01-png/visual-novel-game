<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Frame Splitter & Background Remover</title>
  <!-- Thư viện nén ZIP và tải file -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #050811;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 700px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h2 {
      text-align: center;
      color: #a855f7;
      font-size: 1.3rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    input[type="file"], select, input[type="number"] {
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.9rem;
      outline: none;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .checkbox-group input {
      accent-color: #a855f7;
      width: 18px;
      height: 18px;
    }
    video {
      width: 100%;
      max-height: 250px;
      background: #000;
      border-radius: 8px;
      object-fit: contain;
      display: none;
    }
    .btn {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      text-align: center;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    /* Progress bar */
    #progress-container {
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      transition: width 0.1s linear;
    }
    .progress-text {
      font-size: 0.8rem;
      text-align: center;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🎬 Cắt Video thành Frame & Xóa Phông</h2>

    <div class="form-group">
      <label>1. Chọn video nguồn:</label>
      <input type="file" id="videoFile" accept="video/*">
    </div>

    <video id="videoPreview" controls></video>

    <div class="form-group">
      <label>2. Tốc độ khung hình (FPS cần cắt):</label>
      <select id="fpsSelect">
        <option value="10">10 FPS (Nhanh, dung lượng nhẹ)</option>
        <option value="15" selected>15 FPS (Tiêu chuẩn mượt)</option>
        <option value="24">24 FPS (Mượt cao - Cinematic)</option>
        <option value="30">30 FPS (Rất mượt)</option>
      </select>
    </div>

    <div class="form-group">
      <label>3. Định dạng ảnh xuất ra:</label>
      <select id="formatSelect">
        <option value="image/png" selected>PNG (Hỗ trợ trong suốt tốt nhất)</option>
        <option value="image/jpeg">JPEG (Không hỗ trợ trong suốt)</option>
      </select>
    </div>

    <div class="form-group">
      <div class="checkbox-group">
        <input type="checkbox" id="removeBgCheck" checked>
        <label for="removeBgCheck" style="cursor:pointer; color:#fff; font-weight:600;">✨ Tự động xóa phông nền (Lấy màu ở góc trái trên cùng làm chuẩn)</label>
      </div>
    </div>

    <button class="btn" id="btnProcess" disabled>🚀 Bắt đầu cắt & Đóng gói ZIP</button>

    <div id="progress-container">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">Đang chuẩn bị...</div>
    </div>
  </div>

  <audio id="audioHelper" style="display:none;"></audio>

  <script>
    const videoFile = document.getElementById('videoFile');
    const videoPreview = document.getElementById('videoPreview');
    const fpsSelect = document.getElementById('fpsSelect');
    const formatSelect = document.getElementById('formatSelect');
    const removeBgCheck = document.getElementById('removeBgCheck');
    const btnProcess = document.getElementById('btnProcess');
    
    const progressContainer = document.getElementById('progress-container');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');

    let videoUrl = '';

    videoFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      videoUrl = URL.createObjectURL(file);
      videoPreview.src = videoUrl;
      videoPreview.style.display = 'block';
      btnProcess.disabled = false;
    });

    btnProcess.addEventListener('click', async () => {
      const fps = parseInt(fpsSelect.value);
      const format = formatSelect.value;
      const removeBg = removeBgCheck.checked;
      const ext = format === 'image/png' ? 'png' : 'jpg';

      btnProcess.disabled = true;
      progressContainer.style.display = 'flex';
      progressFill.style.width = '0%';
      progressText.innerText = 'Đang đọc thông tin video...';

      // Tạo đối tượng video ẩn để xử lý trích xuất frame chuẩn xác
      const vid = document.createElement('video');
      vid.src = videoUrl;
      vid.muted = true;
      
      await new Promise((resolve) => {
        vid.onloadedmetadata = () => resolve();
      });

      const duration = vid.duration;
      const interval = 1 / fps;
      const totalFrames = Math.floor(duration * fps);

      const canvas = document.createElement('canvas');
      canvas.width = vid.videoWidth || 1280;
      canvas.height = vid.videoHeight || 720;
      const ctx = canvas.getContext('2d');

      const zip = new JSZip();
      const folder = zip.folder("frames");

      let currentTime = 0;
      let frameIndex = 1;

      while (currentTime <= duration) {
        vid.currentTime = currentTime;
        await new Promise((resolve) => {
          vid.onseeked = () => resolve();
        });

        // Vẽ frame video lên canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);

        // Nếu người dùng chọn xóa phông nền
        if (removeBg && format === 'image/png') {
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;
          
          // Lấy màu mẫu ở góc trên cùng bên trái
          const targetR = data[0];
          const targetG = data[1];
          const targetB = data[2];
          const threshold = 45; // Ngưỡng dung sai

          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            
            if (
              Math.abs(r - targetR) < threshold &&
              Math.abs(g - targetG) < threshold &&
              Math.abs(b - targetB) < threshold
            ) {
              data[i + 3] = 0; // Đặt độ trong suốt về 0 (xóa nền)
            }
          }
          ctx.putImageData(imgData, 0, 0);
        }

        // Chuyển canvas thành base64 / blob
        const dataUrl = canvas.toDataURL(format, 0.9);
        const base64Data = dataUrl.replace(/^data:image\/(png|jpeg);base64,/, "");
        
        // Đặt tên theo số thứ tự: 1.png, 2.png, 3.png...
        folder.file(`${frameIndex}.${ext}`, base64Data, { base64: true });

        // Cập nhật tiến độ
        const percent = Math.min(100, Math.round((frameIndex / totalFrames) * 100));
        progressFill.style.width = `${percent}%`;
        progressText.innerText = `Đang trích xuất & xử lý frame: ${frameIndex} / ${totalFrames} (${percent}%)`;

        currentTime += interval;
        frameIndex++;
      }

      progressText.innerText = 'Đang đóng gói file ZIP...';
      const content = await zip.generateAsync({ type: "blob" }, (metadata) => {
        const p = Math.round(metadata.percent);
        progressFill.style.width = `${p}%`;
        progressText.innerText = `Đang nén ZIP: ${p}%`;
      });

      // Tải file ZIP về máy
      saveAs(content, "character_animation_frames.zip");

      progressText.innerText = '✅ Hoàn tất! Đã tải file ZIP về máy.';
      btnProcess.disabled = false;
    });
  </script>
</body>
</html>

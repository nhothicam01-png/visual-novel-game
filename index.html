<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Visual Novel Web Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #050811;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 10px;
    }

    /* Khung màn hình game (Mặc định Ngang: 1920x1080 -> aspect-ratio 16/9) */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      max-height: 75vh;
      background-color: #000000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      overflow: hidden;
      margin: 0 auto;
      transition: aspect-ratio 0.3s ease, max-width 0.3s ease;
    }

    /* Khi chuyển sang chế độ Dọc: 1080x1920 -> aspect-ratio 9/16 */
    #game-container.portrait {
      aspect-ratio: 9 / 16;
      max-width: 420px;
      max-height: 85vh;
    }

    /* Khi ở chế độ Full màn hình */
    #game-container:fullscreen,
    #game-container:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      border-radius: 0;
      box-shadow: none;
      background-color: #000;
    }

    /* Ép tỷ lệ 1920x1080 (16:9) khi Full màn hình */
    #game-container:fullscreen.force-landscape,
    #game-container:-webkit-full-screen.force-landscape {
      aspect-ratio: 16 / 9 !important;
      width: 100vw !important;
      height: 56.25vw !important;
      max-height: 100vh !important;
      max-width: calc(100vh * 16 / 9) !important;
      margin: auto !important;
    }

    /* Ép tỷ lệ 1080x1920 (9:16) khi Full màn hình */
    #game-container:fullscreen.force-portrait,
    #game-container:-webkit-full-screen.force-portrait {
      aspect-ratio: 9 / 16 !important;
      height: 100vh !important;
      width: calc(100vh * 9 / 16) !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      margin: auto !important;
    }

    .game-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #layer-bg-img, #layer-bg-video { z-index: 1; display: none; }
    
    /* Mặc định - Màn hình Ngang (1920x1080): Bám sát mép ĐỈNH (top: 0) */
    #layer-character {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      width: 100%;
      height: auto;
      object-fit: contain;
      object-position: top center;
      display: none;
      transform-origin: top center;
    }

    /* Màn hình Dọc (.portrait - 1080x1920): Bám sát mép ĐÁY (bottom: 0) */
    #game-container.portrait #layer-character {
      top: auto;
      bottom: 0;
      width: auto;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
      transform-origin: bottom center;
    }

    #layer-vfx { z-index: 3; pointer-events: none; display: none; }

    .character-talking {
      animation: characterTalkAnim 1.2s ease-in-out infinite;
    }

    #game-container.portrait .character-talking {
      animation: characterTalkAnimPortrait 1.2s ease-in-out infinite;
    }

    @keyframes characterTalkAnim {
      0%   { transform: translateX(-50%) translateY(0) scaleY(1); }
      50%  { transform: translateX(-50%) translateY(-1.5%) scaleY(1.01); }
      100% { transform: translateX(-50%) translateY(0) scaleY(1); }
    }

    @keyframes characterTalkAnimPortrait {
      0%   { transform: translateX(-50%) translateY(0) scaleY(1); }
      50%  { transform: translateX(-50%) translateY(+1.5%) scaleY(1.01); }
      100% { transform: translateX(-50%) translateY(0) scaleY(1); }
    }

    #dialogue-canvas {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 10px 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: auto;
      gap: 4px;
    }

    #speaker-name {
      display: none !important;
    }

    #dialogue-text {
      font-size: clamp(1rem, 2.2vw, 1.6rem);
      line-height: 1.4;
      color: #ffffff;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: center;       
      -webkit-text-stroke: 0.8px #000000;
      paint-order: stroke fill;
      text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.9);
    }

    /* --- GIAO DIỆN MÀN HÌNH CHỜ LOAD TIẾN ĐỘ --- */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 8, 17, 0.92);
      z-index: 99;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #loading-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .loading-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #a855f7;
    }

    .loading-bar-bg {
      width: 80%;
      max-width: 400px;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }

    .loading-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      transition: width 0.15s ease;
    }

    .loading-status {
      font-size: 0.8rem;
      color: #cbd5e1;
      max-width: 80%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* ------------------------------------------- */

    #controls {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
    }

    .btn {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.96);
    }

    #volume-controls {
      margin-top: 8px;
      display: flex;
      gap: 14px;
      font-size: 0.8rem;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1000px;
      width: 100%;
    }

    #volume-controls label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #volume-controls input[type="range"] {
      accent-color: #a855f7;
      width: 60px;
    }

    #character-voice-panel {
      margin-top: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #character-voice-panel h4 {
      font-size: 0.85rem;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }

    #character-voice-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 130px;
      overflow-y: auto;
    }

    .char-voice-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      gap: 8px;
      flex-wrap: wrap;
    }

    .char-voice-row label {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #cbd5e1;
    }

    .char-voice-row select, .char-voice-row input[type="range"] {
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 0.75rem;
      accent-color: #a855f7;
    }

    .char-voice-row select {
      max-width: 160px;
      text-overflow: ellipsis;
    }

    .char-voice-row input[type="range"] {
      width: 65px;
    }

    @media (max-width: 600px) {
      #dialogue-canvas { padding: 6px 12px; bottom: 6px; }
      #speaker-name { font-size: 0.8rem; }
      #dialogue-text { font-size: 0.85rem; }
      .btn { padding: 6px 10px; font-size: 0.78rem; }
      #volume-controls { gap: 8px; font-size: 0.72rem; }
      .char-voice-row { font-size: 0.7rem; }
      .char-voice-row select { max-width: 120px; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Khung hiển thị tiến độ tải Dữ liệu -->
    <div id="loading-overlay">
      <div class="loading-title" id="loading-title">⏳ Đang tải tài nguyên... (0%)</div>
      <div class="loading-bar-bg">
        <div class="loading-bar-fill" id="loading-bar-fill"></div>
      </div>
      <div class="loading-status" id="loading-status">Đang khởi tạo...</div>
    </div>

    <img id="layer-bg-img" class="game-layer" src="" alt="Background Image" />
    <video id="layer-bg-video" class="game-layer" autoplay muted loop playsinline></video>
    
    <img id="layer-character" src="" alt="Character" />
    <img id="layer-vfx" class="game-layer" src="" alt="VFX Overlay" />

    <div id="dialogue-canvas" style="display: none;">
      <div id="speaker-name"></div>
      <div id="dialogue-text"></div>
    </div>
  </div>

  <div id="controls">
    <input type="file" id="jsonFile" accept=".json" style="display: none;">
    <button class="btn" id="btn-import">📂 Import JSON</button>
    
    <button id="btn-play" class="btn" onclick="trinhPhat.batDau()">▶ Chạy kịch bản</button>
    <button id="btn-pause" class="btn" onclick="trinhPhat.tamDung()" style="display: none;">⏸ Tạm dừng</button>
    <button id="btn-stop" class="btn" onclick="trinhPhat.dung()">⏹ Dừng phát</button>
    
    <button id="btn-orientation" class="btn" onclick="trinhPhat.toggleOrientation()">📱 Tỷ lệ: 1920×1080</button>
    <button id="btn-fullscreen" class="btn" onclick="trinhPhat.toggleFullscreen()">⛶ Toàn màn hình</button>
  </div>

  <div id="volume-controls">
    <label>
      🔊 BGM: 
      <input type="range" id="vol-bgm" min="0" max="1" step="0.05" value="0.3" oninput="trinhPhat.doiAmLuongBgm(this.value)">
    </label>
    <label>
      🔔 SFX: 
      <input type="range" id="vol-sfx" min="0" max="1" step="0.05" value="0.4" oninput="trinhPhat.doiAmLuongSfx(this.value)">
    </label>
    <label>
      🗣 TTS Vol: 
      <input type="range" id="vol-tts" min="0" max="1" step="0.05" value="1.0" oninput="trinhPhat.doiAmLuongTts(this.value)">
    </label>
  </div>

  <div id="character-voice-panel">
    <h4>🎙️ Cấu hình giọng đọc riêng theo nhân vật</h4>
    <div id="character-voice-list">
      <span style="color: #64748b; font-style: italic;">Chưa có kịch bản hoặc nhân vật nào được tải. Hãy Import JSON trước!</span>
    </div>
  </div>

  <audio id="audio-bgm" loop></audio>
  <audio id="audio-sfx"></audio>

  <script>
    class TrinhPhatKichBanWeb {
      constructor() {
        this.container = document.getElementById('game-container');
        this.layerBgImg = document.getElementById('layer-bg-img');
        this.layerBgVideo = document.getElementById('layer-bg-video');
        this.layerChar = document.getElementById('layer-character');
        this.layerVfx = document.getElementById('layer-vfx');
        this.dialogueCanvas = document.getElementById('dialogue-canvas');
        this.speakerText = document.getElementById('speaker-name');
        this.dialogueText = document.getElementById('dialogue-text');
        this.audioBgm = document.getElementById('audio-bgm');
        this.audioSfx = document.getElementById('audio-sfx');

        // Các phần tử cho Loading Bar
        this.loadingOverlay = document.getElementById('loading-overlay');
        this.loadingTitle = document.getElementById('loading-title');
        this.loadingBarFill = document.getElementById('loading-bar-fill');
        this.loadingStatus = document.getElementById('loading-status');

        this.audioBgm.volume = 0.3;
        this.audioSfx.volume = 0.4;
        this.ttsVolume = 1.0;

        this.boDemAnhNen = new Map();
        this.boDemHieuUng = new Map();
        this.boDemNhanVat = new Map(); // Lưu trữ mảng frame ảnh animation

        this.duLieu = null;
        this.dangChay = false;
        this.dangTamDung = false;
        this.hienChuInterval = null;
        this.currentIndex = 0;

        // Quản lý khung hình animation nhân vật
        this.animFrameInterval = null;
        this.currentFrameIndex = 0;

        this.currentTtsResolve = null;
        this.ttsRemainingText = "";
        this.currentSpeaker = "";

        this.cauHinhGiongNhanVat = {};
        this.ttsSynth = window.speechSynthesis || null;
        this.danhSachVoices = [];

        this.isPortrait = false; 

        this.khoiTaoTTS();
        this.khoiTaoSuKienFile();
        this.khoiTaoSuKienDoubleTapFullscreen();
      }

      // Hàm cập nhật tiến độ Loading Bar
      capNhatTienDoLoad(phamtram, message) {
        const percent = Math.min(100, Math.max(0, Math.round(phamtram)));
        this.loadingTitle.innerText = `⏳ Đang tải tài nguyên... (${percent}%)`;
        this.loadingBarFill.style.width = `${percent}%`;
        if (message) {
          this.loadingStatus.innerText = message;
        }
      }

      // Hàm ẩn/hịên màn hình Loading
      hienLoading(show) {
        if (show) {
          this.capNhatTienDoLoad(0, "Bắt đầu tải kịch bản...");
          this.loadingOverlay.classList.add('active');
        } else {
          this.loadingOverlay.classList.remove('active');
        }
      }

      // Hàm kiểm tra xem ảnh đã có sẵn nền trong suốt (transparent) hay chưa
      hasTransparentBackground(imgElement) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = imgElement.naturalWidth || imgElement.width;
        canvas.height = imgElement.naturalHeight || imgElement.height;
        
        ctx.drawImage(imgElement, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        
        // Kiểm tra thưa qua các pixel xem có kênh alpha < 255 không
        for (let i = 3; i < data.length; i += 4 * 50) {
          if (data[i] < 255) {
            return true; // Đã có sẵn trong suốt
          }
        }
        return false; // Chưa có, cần xóa phông nền đặc
      }

      // Hàm xử lý xóa phông nền tự động cho ảnh (biến màu nền thành trong suốt)
      removeBackgroundFromImage(imgElement) {
        return new Promise((resolve) => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          canvas.width = imgElement.naturalWidth || imgElement.width;
          canvas.height = imgElement.naturalHeight || imgElement.height;
          
          // Vẽ ảnh gốc lên canvas
          ctx.drawImage(imgElement, 0, 0);
          
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;
          
          // Lấy mẫu màu ở góc trên cùng bên trái (màu phông nền cần xóa)
          const targetR = data[0];
          const targetG = data[1];
          const targetB = data[2];
          
          // Ngưỡng dung sai màu (tolerance) để khử viền răng cưa
          const threshold = 40; 

          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            
            if (
              Math.abs(r - targetR) < threshold &&
              Math.abs(g - targetG) < threshold &&
              Math.abs(b - targetB) < threshold
            ) {
              data[i + 3] = 0; // Đặt độ trong suốt (Alpha) về 0
            }
          }
          
          ctx.putImageData(imgData, 0, 0);
          
          const processedImg = new Image();
          processedImg.onload = () => resolve(processedImg);
          processedImg.src = canvas.toDataURL('image/png');
        });
      }

      toggleOrientation() {
        this.isPortrait = !this.isPortrait;
        const btn = document.getElementById('btn-orientation');

        if (this.isPortrait) {
          this.container.classList.add('portrait');
          btn.innerText = "📱 Tỷ lệ: 1080×1920";
        } else {
          this.container.classList.remove('portrait');
          btn.innerText = "📱 Tỷ lệ: 1920×1080";
        }
      }

      khoiTaoTTS() {
        if (this.ttsSynth) {
          const capNhatVoices = () => {
            this.danhSachVoices = this.ttsSynth.getVoices();
            if (this.duLieu && this.danhSachVoices.length > 0) {
              this.quetVaKhoiTaoNhanVat();
            }
          };

          capNhatVoices();
          if (this.ttsSynth.onvoiceschanged !== undefined) {
            this.ttsSynth.onvoiceschanged = capNhatVoices;
          }
        }
      }

      khoiTaoSuKienFile() {
        const btnImport = document.getElementById('btn-import');
        const fileInput = document.getElementById('jsonFile');

        btnImport.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (event) => this.importJSON(event));
      }

      khoiTaoSuKienDoubleTapFullscreen() {
        let lastTapTime = 0;
        this.container.addEventListener('touchend', (e) => {
          const currentTime = new Date().getTime();
          const tapLength = currentTime - lastTapTime;
          if (tapLength < 300 && tapLength > 0) {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            if (isFullscreen) {
              if (!this.dangChay || this.dangTamDung) {
                this.batDau();
              } else {
                this.tamDung();
              }
            }
            e.preventDefault();
          }
          lastTapTime = currentTime;
        });

        this.container.addEventListener('dblclick', () => {
          const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
          if (isFullscreen) {
            if (!this.dangChay || this.dangTamDung) {
              this.batDau();
            } else {
              this.tamDung();
            }
          }
        });
      }

      kichHoatAmThanhMobile() {
        if (this.ttsSynth) {
          this.ttsSynth.resume();
          const dummy = new SpeechSynthesisUtterance('');
          this.ttsSynth.speak(dummy);
        }
        this.audioBgm.play().then(() => this.audioBgm.pause()).catch(() => {});
        this.audioSfx.play().then(() => this.audioSfx.pause()).catch(() => {});
      }

      importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            this.duLieu = JSON.parse(e.target.result);
            
            this.hienLoading(true);
            await this.taiTruocDuLieu();
            this.hienLoading(false);
            
            if (this.ttsSynth) {
              this.danhSachVoices = this.ttsSynth.getVoices();
            }

            this.quetVaKhoiTaoNhanVat();
            alert(`✅ Đã import kịch bản thành công!\nTổng phân cảnh: ${this.duLieu.danh_sach ? this.duLieu.danh_sach.length : 0}`);
          } catch (err) {
            this.hienLoading(false);
            alert("❌ Lỗi phân tích cú pháp JSON: " + err.message);
          }
        };
        reader.readAsText(file);
      }

      quetVaKhoiTaoNhanVat() {
        if (!this.duLieu) return;
        const ds = this.duLieu.danh_sach || this.duLieu.KichBanToanBo || [];
        const setNhanVat = new Set();
        
        ds.forEach(khung => {
          if (khung.nhan_vat && khung.nhan_vat.trim() !== "") {
            setNhanVat.add(khung.nhan_vat.trim());
          }
        });

        setNhanVat.forEach(ten => {
          if (!this.cauHinhGiongNhanVat[ten]) {
            this.cauHinhGiongNhanVat[ten] = {
              voiceIndex: 0,
              rate: 1.1,
              pitch: 1.0,
              lang: 'ja-JP'
            };
          }
        });

        this.taoBangCauHinhNhanVat();
      }

      taoBangCauHinhNhanVat() {
        const container = document.getElementById('character-voice-list');
        container.innerHTML = '';

        const danhSachTen = Object.keys(this.cauHinhGiongNhanVat);
        if (danhSachTen.length === 0) {
          container.innerHTML = '<span style="color: #64748b; font-style: italic;">Không tìm thấy nhân vật nào có thoại trong kịch bản.</span>';
          return;
        }

        danhSachTen.forEach(ten => {
          const cfg = this.cauHinhGiongNhanVat[ten];
          
          let optionsHtml = '';
          const presetLangs = [
            { code: 'ja-JP', name: '🇯🇵 Tiếng Nhật (Japanese)' },
            { code: 'vi-VN', name: '🇻🇳 Tiếng Việt (Vietnamese)' },
            { code: 'en-US', name: '🇺🇸 Tiếng Anh (English)' },
            { code: 'ko-KR', name: '🇰🇷 Tiếng Hàn (Korean)' },
            { code: 'zh-CN', name: '🇨🇳 Tiếng Trung (Chinese)' }
          ];

          presetLangs.forEach(lang => {
            const selected = (cfg.lang === lang.code) ? 'selected' : '';
            optionsHtml += `<option value="${lang.code}" ${selected}>${lang.name}</option>`;
          });

          if (this.danhSachVoices.length > 0) {
            this.danhSachVoices.forEach((v, idx) => {
              const selected = (cfg.voiceIndex === idx) ? 'selected' : '';
              optionsHtml += `<option value="${idx}" ${selected}>${v.name} (${v.lang})</option>`;
            });
          }

          const row = document.createElement('div');
          row.className = 'char-voice-row';
          row.innerHTML = `
            <span style="font-weight: bold; color: #a855f7; min-width: 70px;">${ten}</span>
            <label>Giọng: <select onchange="trinhPhat.doiGiongNhanVat('${ten}', 'voice', this.value)">${optionsHtml}</select></label>
            <label>Tốc độ: <span id="rate-val-${ten}">${cfg.rate}</span><input type="range" min="0" max="2.0" step="0.1" value="${cfg.rate}" oninput="trinhPhat.doiGiongNhanVat('${ten}', 'rate', this.value)"></label>
            <label>Cao độ: <span id="pitch-val-${ten}">${cfg.pitch}</span><input type="range" min="0" max="2.0" step="0.1" value="${cfg.pitch}" oninput="trinhPhat.doiGiongNhanVat('${ten}', 'pitch', this.value)"></label>
          `;
          container.appendChild(row);
        });
      }

      doiGiongNhanVat(tenNhanVat, loai, giaTri) {
        if (!this.cauHinhGiongNhanVat[tenNhanVat]) return;

        if (loai === 'voice') {
          if (isNaN(giaTri)) {
            this.cauHinhGiongNhanVat[tenNhanVat].lang = giaTri;
            const foundIdx = this.danhSachVoices.findIndex(v => v.lang.toLowerCase().includes(giaTri.toLowerCase().split('-')[0]));
            if (foundIdx !== -1) {
              this.cauHinhGiongNhanVat[tenNhanVat].voiceIndex = foundIdx;
            }
          } else {
            this.cauHinhGiongNhanVat[tenNhanVat].voiceIndex = parseInt(giaTri);
            if (this.danhSachVoices[giaTri]) {
              this.cauHinhGiongNhanVat[tenNhanVat].lang = this.danhSachVoices[giaTri].lang;
            }
          }
        } else if (loai === 'rate') {
          this.cauHinhGiongNhanVat[tenNhanVat].rate = parseFloat(giaTri);
          document.getElementById(`rate-val-${tenNhanVat}`).innerText = giaTri;
        } else if (loai === 'pitch') {
          this.cauHinhGiongNhanVat[tenNhanVat].pitch = parseFloat(giaTri);
          document.getElementById(`pitch-val-${tenNhanVat}`).innerText = giaTri;
        }
      }

      doiAmLuongBgm(val) { this.audioBgm.volume = parseFloat(val); }
      doiAmLuongSfx(val) { this.audioSfx.volume = parseFloat(val); }
      doiAmLuongTts(val) { this.ttsVolume = parseFloat(val); }

      async toggleFullscreen() {
        try {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (this.isPortrait) {
              this.container.classList.add('force-portrait');
              this.container.classList.remove('force-landscape');
            } else {
              this.container.classList.add('force-landscape');
              this.container.classList.remove('force-portrait');
            }

            if (this.container.requestFullscreen) await this.container.requestFullscreen();
            else if (this.container.webkitRequestFullscreen) await this.container.webkitRequestFullscreen();
            
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock(this.isPortrait ? 'portrait' : 'landscape').catch(() => {});
            }
          } else {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
            
            this.container.classList.remove('force-landscape', 'force-portrait');
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
          }
        } catch (e) { console.log(e); }
      }

      async taiTruocDuLieu() {
        const ds = this.duLieu.danh_sach || this.duLieu.KichBanToanBo;
        if (!ds) return;

        const tasks = [];
        for (const khung of ds) {
          const anhNen = khung.anh_nen || khung.background;
          const anhHieuUng = khung.anh_hieu_ung || khung.vfx;
          const nhanVat = khung.nhan_vat;
          const bieuCam = khung.bieu_cam || khung.expression;

          if (anhNen && !this.isMediaVideo(anhNen) && !this.boDemAnhNen.has(anhNen)) {
            tasks.push({
              name: `Nền: ${anhNen}`,
              run: () => this.preloadImage(`assets/Nen/${anhNen}`, img => this.boDemAnhNen.set(anhNen, img))
            });
          }
          if (anhHieuUng && !this.boDemHieuUng.has(anhHieuUng)) {
            tasks.push({
              name: `VFX: ${anhHieuUng}`,
              run: () => this.preloadImage(`assets/HieuUng/${anhHieuUng}`, img => this.boDemHieuUng.set(anhHieuUng, img))
            });
          }
          
          if (nhanVat && bieuCam) {
            const key = `${nhanVat}/${bieuCam}`;
            if (!this.boDemNhanVat.has(key)) {
              tasks.push({
                name: `Nhân vật: ${nhanVat} (${bieuCam})`,
                run: () => this.preloadCharacterFrames(nhanVat, bieuCam, key)
              });
            }
          }
        }

        const totalTasks = tasks.length;
        if (totalTasks === 0) {
          this.capNhatTienDoLoad(100, "Hoàn tất!");
          return;
        }

        let completedTasks = 0;
        for (const task of tasks) {
          this.capNhatTienDoLoad((completedTasks / totalTasks) * 100, `Đang xử lý: ${task.name}`);
          await task.run();
          completedTasks++;
          this.capNhatTienDoLoad((completedTasks / totalTasks) * 100, `Đã xong: ${task.name}`);
        }
        this.capNhatTienDoLoad(100, "Tải hoàn tất!");
      }
      
      async preloadCharacterFrames(nhanVat, bieuCam, cacheKey) {
        let frameImages = [];
        let i = 1;
        let continueSearching = true;

        while (continueSearching && i <= 50) {
          const framePath = `assets/NhanVat/${nhanVat}/${bieuCam}/${i}.png`;
          const loadedImg = await this.checkAndLoadImage(framePath);
          
          if (loadedImg) {
            let processedImg = loadedImg;
            
            // 🚀 Kiểm tra nếu ảnh chưa có sẵn nền trong suốt thì mới tiến hành xóa phông
            if (!this.hasTransparentBackground(loadedImg)) {
              processedImg = await this.removeBackgroundFromImage(loadedImg);
            }
            
            frameImages.push(processedImg);
            i++;
          } else {
            continueSearching = false;
          }
        }

        // Fallback nếu dùng file ảnh đơn cũ
        if (frameImages.length === 0) {
          const singlePath = `assets/NhanVat/${nhanVat}/${bieuCam}.png`;
          const singleImg = await this.checkAndLoadImage(singlePath);
          if (singleImg) {
            let processedSingle = singleImg;
            if (!this.hasTransparentBackground(singleImg)) {
              processedSingle = await this.removeBackgroundFromImage(singleImg);
            }
            frameImages.push(processedSingle);
          }
        }

        this.boDemNhanVat.set(cacheKey, frameImages);
      }

      checkAndLoadImage(src) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = src;
        });
      }

      isMediaVideo(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        return ['mp4', 'webm', 'ogg', 'mov'].includes(ext);
      }

      preloadImage(src, callback) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => { callback(img); resolve(); };
          img.onerror = () => resolve();
          img.src = src;
        });
      }

      async batDau() {
        this.kichHoatAmThanhMobile(); 

        if (this.dangChay && !this.dangTamDung) return;

        if (this.dangTamDung) {
          this.dangTamDung = false;
          document.getElementById('btn-pause').innerText = "⏸ Tạm dừng";
          if (this.audioBgm.paused) this.audioBgm.play().catch(()=>{});
          if (this.layerBgVideo.style.display === 'block') this.layerBgVideo.play().catch(()=>{});
          
          if (this.ttsRemainingText && this.currentTtsResolve) {
            this.docVanBanBangTTS(this.currentSpeaker, this.ttsRemainingText, this.currentTtsResolve);
          }
          return;
        }

        if (!this.duLieu) {
          this.duLieu = {
            thoi_gian_cho_giua: 0.02,
            toc_do_go_chu: 0.03,
            danh_sach: [
              {
                nhan_vat: "An",
                bieu_cam: "binh_thuong",
                noi_dung: "Hãy bấm Import JSON để tải kịch bản của bạn vào nhé!",
                anh_nen: "bg_school.png",
                am_thanh_nen: "bgm_gentle.mp3"
              }
            ]
          };
          this.quetVaKhoiTaoNhanVat();
        }

        document.getElementById('btn-pause').style.display = 'inline-block';
        this.currentIndex = 0;
        this.chayToanBo();
      }

      tamDung() {
        if (!this.dangChay) return;

        if (!this.dangTamDung) {
          this.dangTamDung = true;
          document.getElementById('btn-pause').innerText = "▶ Tiếp tục";
          if (this.ttsSynth) this.ttsSynth.cancel();
          this.dungAnimationKhungHinh();

          this.audioBgm.pause();
          this.audioSfx.pause();
          if (this.layerBgVideo.style.display === 'block') this.layerBgVideo.pause();
        } else {
          this.dangTamDung = false;
          document.getElementById('btn-pause').innerText = "⏸ Tạm dừng";
          if (this.audioBgm.play) this.audioBgm.play().catch(()=>{});
          if (this.layerBgVideo.style.display === 'block') this.layerBgVideo.play().catch(()=>{});

          if (this.currentSpeaker) {
            const currentCfg = this.duLieu.danh_sach[this.currentIndex];
            if (currentCfg) this.batDauAnimationKhungHinh(currentCfg.nhan_vat, currentCfg.bieu_cam);
          }

          if (this.ttsRemainingText && this.currentTtsResolve) {
            this.docVanBanBangTTS(this.currentSpeaker, this.ttsRemainingText, this.currentTtsResolve);
          }
        }
      }

      async chayToanBo() {
        this.dangChay = true;
        const ds = this.duLieu.danh_sach || this.duLieu.KichBanToanBo || [];
        
        while (this.currentIndex < ds.length) {
          if (!this.dangChay) break;
          while (this.dangTamDung) {
            await this.sleep(100);
            if (!this.dangChay) break;
          }
          if (!this.dangChay) break;

          const khung = ds[this.currentIndex];
          await this.xuLyKhung(khung);
          
          this.currentIndex++;
        }

        this.dangChay = false;
        document.getElementById('btn-pause').style.display = 'none';
        this.xoaChu();
      }

      async xuLyKhung(khung) {
        this.xoaChuKhongAnCanvas();

        const anhNen = khung.anh_nen || khung.background;
        const nhanVat = khung.nhan_vat;
        const bieuCam = khung.bieu_cam || khung.expression;
        const anhHieuUng = khung.anh_hieu_ung || khung.vfx;
        const noiDung = khung.noi_dung;
        const amThanhNen = khung.am_thanh_nen || khung.bgm;
        const amThanhHieuUng = khung.am_thanh_hieu_ung || khung.sfx;

        if (anhNen && anhNen.trim() !== "") {
          if (this.isMediaVideo(anhNen)) {
            this.layerBgImg.style.display = 'none';
            if (!this.layerBgVideo.src.includes(anhNen)) {
              this.layerBgVideo.src = `assets/Nen/${anhNen}`;
              this.layerBgVideo.load();
            }
            this.layerBgVideo.style.display = 'block';
            await this.layerBgVideo.play().catch(()=>{});
          } else {
            this.layerBgVideo.style.display = 'none';
            const bgImg = this.boDemAnhNen.get(anhNen);
            if (bgImg) {
              this.layerBgImg.src = bgImg.src;
            } else {
              await new Promise(r => {
                this.layerBgImg.onload = r;
                this.layerBgImg.onerror = r;
                this.layerBgImg.src = `assets/Nen/${anhNen}`;
              });
            }
            this.layerBgImg.style.display = 'block';
          }
        }

        if (nhanVat && bieuCam && nhanVat.trim() !== "" && bieuCam.trim() !== "") {
          const cacheKey = `${nhanVat}/${bieuCam}`;
          const frames = this.boDemNhanVat.get(cacheKey);
          
          if (frames && frames.length > 0) {
            this.layerChar.src = frames[0].src;
            this.layerChar.style.display = 'block';
            
            if (frames.length > 1) {
              this.batDauAnimationKhungHinh(nhanVat, bieuCam);
            } else {
              this.dungAnimationKhungHinh();
            }
          } else {
            this.layerChar.style.display = 'none';
          }

          if (!this.layerChar.classList.contains('character-talking')) {
            this.layerChar.classList.add('character-talking');
          }
        } else {
          this.layerChar.style.display = 'none';
          this.layerChar.classList.remove('character-talking');
          this.dungAnimationKhungHinh();
        }

        if (anhHieuUng && anhHieuUng.trim() !== "") {
          const vfxImg = this.boDemHieuUng.get(anhHieuUng);
          this.layerVfx.src = vfxImg ? vfxImg.src : `assets/HieuUng/${anhHieuUng}`;
          this.layerVfx.style.display = 'block';
        } else {
          this.layerVfx.style.display = 'none';
        }

        if (amThanhNen && amThanhNen.trim() !== "") {
          const bgmPath = `assets/AmThanh/Nen/${amThanhNen}`;
          if (!this.audioBgm.src.includes(amThanhNen)) {
            this.audioBgm.src = bgmPath;
            this.audioBgm.loop = true;
            this.audioBgm.play().catch(() => {});
          }
        }

        if (amThanhHieuUng && amThanhHieuUng.trim() !== "") {
          this.audioSfx.src = `assets/AmThanh/HieuUng/${amThanhHieuUng}`;
          this.audioSfx.play().catch(() => {});
        }

        if (noiDung) {
          this.hienLoiThoai(nhanVat, noiDung);
          this.currentSpeaker = nhanVat;
          this.ttsRemainingText = noiDung;
          
          await new Promise((resolve) => {
            this.currentTtsResolve = resolve;
            this.docVanBanBangTTS(nhanVat, noiDung, resolve);
          });
        } else {
          await this.sleep(1000);
        }

        this.dungAnimationKhungHinh();
        const thoiGianCho = (this.duLieu && this.duLieu.thoi_gian_cho_giua !== undefined) ? this.duLieu.thoi_gian_cho_giua : 0.02;
        await this.sleep(thoiGianCho * 1000);
      }

      batDauAnimationKhungHinh(nhanVat, bieuCam) {
        this.dungAnimationKhungHinh();
        const cacheKey = `${nhanVat}/${bieuCam}`;
        const frames = this.boDemNhanVat.get(cacheKey);
        if (!frames || frames.length <= 1) return;

        this.currentFrameIndex = 0;
        this.animFrameInterval = setInterval(() => {
          if (!this.dangTamDung && this.dangChay) {
            this.currentFrameIndex = (this.currentFrameIndex + 1) % frames.length;
            this.layerChar.src = frames[this.currentFrameIndex].src;
          }
        }, 250);
      }

      dungAnimationKhungHinh() {
        if (this.animFrameInterval) {
          clearInterval(this.animFrameInterval);
          this.animFrameInterval = null;
        }
      }

      docVanBanBangTTS(nhanVat, text, resolveCallback) {
        if (!text || !this.ttsSynth) {
          resolveCallback();
          return;
        }

        this.ttsSynth.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        const cfg = (nhanVat && this.cauHinhGiongNhanVat[nhanVat]) 
          ? this.cauHinhGiongNhanVat[nhanVat] 
          : { voiceIndex: 0, rate: 1.1, pitch: 1.0, lang: 'ja-JP' };

        utterance.lang = cfg.lang || 'ja-JP';

        if (this.danhSachVoices.length > 0 && this.danhSachVoices[cfg.voiceIndex]) {
          utterance.voice = this.danhSachVoices[cfg.voiceIndex];
        }

        utterance.volume = this.ttsVolume;
        utterance.rate = cfg.rate;
        utterance.pitch = cfg.pitch;

        utterance.onboundary = (event) => {
          if (event.name === 'word') {
            this.ttsRemainingText = text.substring(event.charIndex);
          }
        };

        utterance.onend = () => {
          this.ttsRemainingText = "";
          this.currentTtsResolve = null;
          resolveCallback();
        };

        utterance.onerror = () => {
          this.ttsRemainingText = "";
          this.currentTtsResolve = null;
          resolveCallback();
        };

        this.ttsSynth.speak(utterance);
      }

      hienLoiThoai(ten, noiDung) {
        this.dialogueCanvas.style.display = 'flex';
        if (ten && ten.trim() !== "") {
          this.speakerText.innerText = ten;
          this.speakerText.style.display = 'block';
        } else {
          this.speakerText.style.display = 'none';
        }

        let idx = 0;
        this.dialogueText.innerText = '';
        clearInterval(this.hienChuInterval);
        
        const speed = (this.duLieu ? this.duLieu.toc_do_go_chu : 0.03) * 1000;
        this.hienChuInterval = setInterval(() => {
          if (!this.dangTamDung && this.dangChay) {
            if (idx < noiDung.length) {
              this.dialogueText.innerText += noiDung.charAt(idx);
              idx++;
            } else {
              clearInterval(this.hienChuInterval);
            }
          }
        }, speed);
      }

      xoaChuKhongAnCanvas() {
        clearInterval(this.hienChuInterval);
        this.dialogueText.innerText = '';
        this.speakerText.innerText = '';
      }

      xoaChu() {
        this.xoaChuKhongAnCanvas();
        this.dialogueCanvas.style.display = 'none';
      }

      dung() {
        this.dangChay = false;
        this.dangTamDung = false;
        this.ttsRemainingText = "";
        this.currentTtsResolve = null;
        document.getElementById('btn-pause').style.display = 'none';
        document.getElementById('btn-pause').innerText = "⏸ Tạm dừng";
        clearInterval(this.hienChuInterval);
        this.dungAnimationKhungHinh();
        if (this.ttsSynth) this.ttsSynth.cancel();
        this.audioBgm.pause();
        this.audioSfx.pause();
        this.layerBgVideo.pause();
        this.xoaChu();
        this.layerBgImg.style.display = 'none';
        this.layerBgVideo.style.display = 'none';
        this.layerChar.style.display = 'none';
        this.layerChar.classList.remove('character-talking');
        this.layerVfx.style.display = 'none';
      }

      sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }
    }

    const trinhPhat = new TrinhPhatKichBanWeb();
  </script>
</body>

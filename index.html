<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Visual Novel Web Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #050811;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 10px;
    }

    /* Khung màn hình game (Co giãn chuẩn tỷ lệ 16:9 trên mobile) */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      max-height: 75vh;
      background-color: #000000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      overflow: hidden;
      margin: 0 auto;
    }

    #game-container:fullscreen,
    #game-container:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      border-radius: 0;
      box-shadow: none;
      background-color: #000;
    }

    .game-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #layer-bg-img, #layer-bg-video { z-index: 1; display: none; }
    
    #layer-character {
      z-index: 2;
      object-fit: contain;
      display: none;
      transform-origin: bottom center;
      height: calc(100% + 35px);
      margin-bottom: -35px;
    }

    #layer-vfx { z-index: 3; pointer-events: none; display: none; }

    .character-talking {
      animation: characterTalkAnim 1.2s ease-in-out infinite;
    }

    @keyframes characterTalkAnim {
      0%   { transform: translateY(0) scaleY(1); }
      50%  { transform: translateY(-2%) scaleY(1.01); }
      100% { transform: translateY(0) scaleY(1); }
    }

    #dialogue-canvas {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 10px 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: auto;
      gap: 4px;
    }

    #speaker-name {
      
      display: none;
    }

    #dialogue-text {
      font-size: clamp(0.95rem, 1.7vw, 1.5rem);
      line-height: 1.4;
      color: #ffffff;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: center;       
      text-shadow: 
        -1px -1px 0 #000,  
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000,
         0px  2px 4px rgba(0, 0, 0, 0.8);
    }

    #controls {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
    }

    .btn {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.96);
    }

    #volume-controls {
      margin-top: 8px;
      display: flex;
      gap: 14px;
      font-size: 0.8rem;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1000px;
      width: 100%;
    }

    #volume-controls label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #volume-controls input[type="range"] {
      accent-color: #a855f7;
      width: 60px;
    }

    #character-voice-panel {
      margin-top: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #character-voice-panel h4 {
      font-size: 0.85rem;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }

    #character-voice-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 130px;
      overflow-y: auto;
    }

    .char-voice-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      gap: 8px;
      flex-wrap: wrap;
    }

    .char-voice-row label {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #cbd5e1;
    }

    .char-voice-row select, .char-voice-row input[type="range"] {
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 0.75rem;
      accent-color: #a855f7;
    }

    .char-voice-row select {
      max-width: 160px;
      text-overflow: ellipsis;
    }

    .char-voice-row input[type="range"] {
      width: 65px;
    }

    @media (max-width: 600px) {
      #dialogue-canvas { padding: 6px 12px; bottom: 6px; }
      #speaker-name { font-size: 0.8rem; }
      #dialogue-text { font-size: 0.85rem; }
      .btn { padding: 6px 10px; font-size: 0.78rem; }
      #volume-controls { gap: 8px; font-size: 0.72rem; }
      .char-voice-row { font-size: 0.7rem; }
      .char-voice-row select { max-width: 120px; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <img id="layer-bg-img" class="game-layer" src="" alt="Background Image" />
    <video id="layer-bg-video" class="game-layer" autoplay muted loop playsinline></video>
    
    <img id="layer-character" class="game-layer" src="" alt="Character" />
    <img id="layer-vfx" class="game-layer" src="" alt="VFX Overlay" />

    <div id="dialogue-canvas" style="display: none;">
      <div id="speaker-name"></div>
      <div id="dialogue-text"></div>
    </div>
  </div>

  <div id="controls">
    <input type="file" id="jsonFile" accept=".json" style="display: none;">
    <button class="btn" id="btn-import">📂 Import JSON</button>
    
    <button id="btn-play" class="btn" onclick="trinhPhat.batDau()">▶ Chạy kịch bản</button>
    <button id="btn-pause" class="btn" onclick="trinhPhat.tamDung()" style="display: none;">⏸ Tạm dừng</button>
    <button id="btn-stop" class="btn" onclick="trinhPhat.dung()">⏹ Dừng phát</button>
    <button id="btn-fullscreen" class="btn" onclick="trinhPhat.toggleFullscreen()">⛶ Toàn màn hình</button>
  </div>

  <div id="volume-controls">
    <label>
      🔊 BGM: 
      <input type="range" id="vol-bgm" min="0" max="1" step="0.05" value="0.3" oninput="trinhPhat.doiAmLuongBgm(this.value)">
    </label>
    <label>
      🔔 SFX: 
      <input type="range" id="vol-sfx" min="0" max="1" step="0.05" value="0.4" oninput="trinhPhat.doiAmLuongSfx(this.value)">
    </label>
    <label>
      🗣 TTS Vol: 
      <input type="range" id="vol-tts" min="0" max="1" step="0.05" value="1.0" oninput="trinhPhat.doiAmLuongTts(this.value)">
    </label>
  </div>

  <div id="character-voice-panel">
    <h4>🎙️ Cấu hình giọng đọc riêng theo nhân vật</h4>
    <div id="character-voice-list">
      <span style="color: #64748b; font-style: italic;">Chưa có kịch bản hoặc nhân vật nào được tải. Hãy Import JSON trước!</span>
    </div>
  </div>

  <audio id="audio-bgm" loop></audio>
  <audio id="audio-sfx"></audio>

  <script>
    class TrinhPhatKichBanWeb {
      constructor() {
        this.container = document.getElementById('game-container');
        this.layerBgImg = document.getElementById('layer-bg-img');
        this.layerBgVideo = document.getElementById('layer-bg-video');
        this.layerChar = document.getElementById('layer-character');
        this.layerVfx = document.getElementById('layer-vfx');
        this.dialogueCanvas = document.getElementById('dialogue-canvas');
        this.speakerText = document.getElementById('speaker-name');
        this.dialogueText = document.getElementById('dialogue-text');
        this.audioBgm = document.getElementById('audio-bgm');
        this.audioSfx = document.getElementById('audio-sfx');

        this.audioBgm.volume = 0.3;
        this.audioSfx.volume = 0.4;
        this.ttsVolume = 1.0;

        this.boDemAnhNen = new Map();
        this.boDemHieuUng = new Map();
        this.boDemNhanVat = new Map();

        this.duLieu = null;
        this.dangChay = false;
        this.dangTamDung = false;
        this.hienChuInterval = null;
        this.currentIndex = 0;

        this.cauHinhGiongNhanVat = {};
        this.ttsSynth = window.speechSynthesis || null;
        this.danhSachVoices = [];

        this.khoiTaoTTS();
        this.khoiTaoSuKienFile();
      }

      khoiTaoTTS() {
        if (this.ttsSynth) {
          const capNhatVoices = () => {
            this.danhSachVoices = this.ttsSynth.getVoices();
            // Nếu đã import JSON trước đó mà lúc đầu danh sách giọng bị trống, tiến hành render lại bảng ngay khi tải xong giọng
            if (this.duLieu && this.danhSachVoices.length > 0) {
              this.quetVaKhoiTaoNhanVat();
            }
          };

          capNhatVoices();
          if (this.ttsSynth.onvoiceschanged !== undefined) {
            this.ttsSynth.onvoiceschanged = capNhatVoices;
          }
        }
      }

      khoiTaoSuKienFile() {
        const btnImport = document.getElementById('btn-import');
        const fileInput = document.getElementById('jsonFile');

        btnImport.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (event) => this.importJSON(event));
      }

      kichHoatAmThanhMobile() {
        if (this.ttsSynth) {
          this.ttsSynth.resume();
          const dummy = new SpeechSynthesisUtterance('');
          this.ttsSynth.speak(dummy);
        }
        this.audioBgm.play().then(() => this.audioBgm.pause()).catch(() => {});
        this.audioSfx.play().then(() => this.audioSfx.pause()).catch(() => {});
      }

      importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            this.duLieu = JSON.parse(e.target.result);
            await this.taiTruocDuLieu();
            
            // Ép buộc trình duyệt lấy lại danh sách giọng một lần nữa trước khi quét nhân vật
            if (this.ttsSynth) {
              this.danhSachVoices = this.ttsSynth.getVoices();
            }

            this.quetVaKhoiTaoNhanVat();
            alert(`✅ Đã import kịch bản thành công!\nTổng phân cảnh: ${this.duLieu.danh_sach ? this.duLieu.danh_sach.length : 0}`);
          } catch (err) {
            alert("❌ Lỗi phân tích cú pháp JSON: " + err.message);
          }
        };
        reader.readAsText(file);
      }

      quetVaKhoiTaoNhanVat() {
        if (!this.duLieu) return;
        const ds = this.duLieu.danh_sach || this.duLieu.KichBanToanBo || [];
        const setNhanVat = new Set();
        
        ds.forEach(khung => {
          if (khung.nhan_vat && khung.nhan_vat.trim() !== "") {
            setNhanVat.add(khung.nhan_vat.trim());
          }
        });

        setNhanVat.forEach(ten => {
          if (!this.cauHinhGiongNhanVat[ten]) {
            // Ưu tiên tìm giọng tiếng Việt, nếu không có lấy giọng đầu tiên trong danh sách
            const defaultViIdx = this.danhSachVoices.findIndex(v => v.lang.toLowerCase().includes('vi'));
            this.cauHinhGiongNhanVat[ten] = {
              voiceIndex: defaultViIdx !== -1 ? defaultViIdx : 0,
              rate: 1.1,
              pitch: 1.0
            };
          }
        });

        this.taoBangCauHinhNhanVat();
      }

      taoBangCauHinhNhanVat() {
        const container = document.getElementById('character-voice-list');
        container.innerHTML = '';

        const danhSachTen = Object.keys(this.cauHinhGiongNhanVat);
        if (danhSachTen.length === 0) {
          container.innerHTML = '<span style="color: #64748b; font-style: italic;">Không tìm thấy nhân vật nào có thoại trong kịch bản.</span>';
          return;
        }

        danhSachTen.forEach(ten => {
          const cfg = this.cauHinhGiongNhanVat[ten];
          
          let optionsHtml = '';
          if (this.danhSachVoices.length === 0) {
            optionsHtml = `<option value="0">Đang tải danh sách giọng...</option>`;
          } else {
            this.danhSachVoices.forEach((v, idx) => {
              const selected = (cfg.voiceIndex === idx) ? 'selected' : '';
              optionsHtml += `<option value="${idx}" ${selected}>${v.name} (${v.lang})</option>`;
            });
          }

          const row = document.createElement('div');
          row.className = 'char-voice-row';
          row.innerHTML = `
            <span style="font-weight: bold; color: #a855f7; min-width: 70px;">${ten}</span>
            <label>Giọng: <select onchange="trinhPhat.doiGiongNhanVat('${ten}', 'voice', this.value)">${optionsHtml}</select></label>
            <label>Tốc độ: <span id="rate-val-${ten}">${cfg.rate}</span><input type="range" min="0.5" max="2.0" step="0.1" value="${cfg.rate}" oninput="trinhPhat.doiGiongNhanVat('${ten}', 'rate', this.value)"></label>
            <label>Cao độ: <span id="pitch-val-${ten}">${cfg.pitch}</span><input type="range" min="0.5" max="1.5" step="0.1" value="${cfg.pitch}" oninput="trinhPhat.doiGiongNhanVat('${ten}', 'pitch', this.value)"></label>
          `;
          container.appendChild(row);
        });
      }

      doiGiongNhanVat(tenNhanVat, loai, giaTri) {
        if (!this.cauHinhGiongNhanVat[tenNhanVat]) return;

        if (loai === 'voice') {
          this.cauHinhGiongNhanVat[tenNhanVat].voiceIndex = parseInt(giaTri);
        } else if (loai === 'rate') {
          this.cauHinhGiongNhanVat[tenNhanVat].rate = parseFloat(giaTri);
          document.getElementById(`rate-val-${tenNhanVat}`).innerText = giaTri;
        } else if (loai === 'pitch') {
          this.cauHinhGiongNhanVat[tenNhanVat].pitch = parseFloat(giaTri);
          document.getElementById(`pitch-val-${tenNhanVat}`).innerText = giaTri;
        }
      }

      doiAmLuongBgm(val) { this.audioBgm.volume = parseFloat(val); }
      doiAmLuongSfx(val) { this.audioSfx.volume = parseFloat(val); }
      doiAmLuongTts(val) { this.ttsVolume = parseFloat(val); }

      async toggleFullscreen() {
        try {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (this.container.requestFullscreen) await this.container.requestFullscreen();
            else if (this.container.webkitRequestFullscreen) await this.container.webkitRequestFullscreen();
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
          } else {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
          }
        } catch (e) { console.log(e); }
      }

      async taiTruocDuLieu() {
        const ds = this.duLieu.danh_sach || this.duLieu.KichBanToanBo;
        if (!ds) return;

        const promises = [];
        for (const khung of ds) {
          const anhNen = khung.anh_nen || khung.background;
          const anhHieuUng = khung.anh_hieu_ung || khung.vfx;
          const nhanVat = khung.nhan_vat;
          const bieuCam = khung.bieu_cam || khung.expression;

          if (anhNen && !this.isMediaVideo(anhNen) && !this.boDemAnhNen.has(anhNen)) {
            promises.push(this.preloadImage(`assets/Nen/${anhNen}`, img => this.boDemAnhNen.set(anhNen, img)));
          }
          if (anhHieuUng && !this.boDemHieuUng.has(anhHieuUng)) {
            promises.push(this.preloadImage(`assets/HieuUng/${anhHieuUng}`, img => this.boDemHieuUng.set(anhHieuUng, img)));
          }
          if (nhanVat && bieuCam) {
            const key = `${nhanVat}/${bieuCam}`;
            if (!this.boDemNhanVat.has(key)) {
              promises.push(this.preloadImage(`assets/NhanVat/${key}.png`, img => this.boDemNhanVat.set(key, img)));
            }
          }
        }
        await Promise.all(promises);
      }

      isMediaVideo(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        return ['mp4', 'webm', 'ogg', 'mov'].includes(ext);
      }

      preloadImage(src, callback) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => { callback(img); resolve(); };
          img.onerror = () => resolve();
          img.src = src;
        });
      }

      async batDau() {
        this.kichHoatAmThanhMobile(); 

        if (this.dangChay && !this.dangTamDung) return;

        if (this.dangTamDung) {
          this.dangTamDung = false;
          document.getElementById('btn-pause').innerText = "⏸ Tạm dừng";
          if (this.ttsSynth && this.ttsSynth.paused) this.ttsSynth.resume();
          if (this.audioBgm.paused) this.audioBgm.play().catch(()=>{});
          return;
        }

        if (!this.duLieu) {
          this.duLieu = {
            thoi_gian_cho_giua: 0.02,
            toc_do_go_chu: 0.03,
            danh_sach: [
              {
                nhan_vat: "An",
                bieu_cam: "binh_thuong",
                noi_dung: "Hãy bấm Import JSON để tải kịch bản của bạn vào nhé!",
                anh_nen: "bg_school.png",
                am_thanh_nen: "bgm_gentle.mp3"
              }
            ]
          };
          this.quetVaKhoiTaoNhanVat();
        }

        document.getElementById('btn-pause').style.display = 'inline-block';
        this.currentIndex = 0;
        this.chayToanBo();
      }

      tamDung() {
        if (!this.dangChay) return;

        if (!this.dangTamDung) {
          this.dangTamDung = true;
          document.getElementById('btn-pause').innerText = "▶ Tiếp tục";
          if (this.ttsSynth) this.ttsSynth.pause();
          this.audioBgm.pause();
          this.audioSfx.pause();
          if (this.layerBgVideo.style.display === 'block') this.layerBgVideo.pause();
        } else {
          this.dangTamDung = false;
          document.getElementById('btn-pause').innerText = "⏸ Tạm dừng";
          if (this.ttsSynth && this.ttsSynth.paused) this.ttsSynth.resume();
          this.audioBgm.play().catch(()=>{});
          if (this.layerBgVideo.style.display === 'block') this.layerBgVideo.play().catch(()=>{});
        }
      }

      async chayToanBo() {
        this.dangChay = true;
        const ds = this.duLieu.danh_sach || this.duLieu.KichBanToanBo || [];
        
        while (this.currentIndex < ds.length) {
          if (!this.dangChay) break;
          while (this.dangTamDung) {
            await this.sleep(100);
            if (!this.dangChay) break;
          }
          if (!this.dangChay) break;

          const khung = ds[this.currentIndex];
          await this.xuLyKhung(khung);
          
          await this.sleep((this.duLieu.thoi_gian_cho_giua || 0.02) * 1000);
          this.currentIndex++;
        }

        this.dangChay = false;
        document.getElementById('btn-pause').style.display = 'none';
        this.xoaChu();
      }

      async xuLyKhung(khung) {
        this.xoaChuKhongAnCanvas();

        const anhNen = khung.anh_nen || khung.background;
        const nhanVat = khung.nhan_vat;
        const bieuCam = khung.bieu_cam || khung.expression;
        const anhHieuUng = khung.anh_hieu_ung || khung.vfx;
        const noiDung = khung.noi_dung;
        const amThanhNen = khung.am_thanh_nen || khung.bgm;
        const amThanhHieuUng = khung.am_thanh_hieu_ung || khung.sfx;

        if (anhNen && anhNen.trim() !== "") {
          if (this.isMediaVideo(anhNen)) {
            this.layerBgImg.style.display = 'none';
            if (!this.layerBgVideo.src.includes(anhNen)) this.layerBgVideo.src = `assets/Nen/${anhNen}`;
            this.layerBgVideo.style.display = 'block';
            this.layerBgVideo.play().catch(()=>{});
          } else {
            this.layerBgVideo.style.display = 'none';
            const bgImg = this.boDemAnhNen.get(anhNen);
            this.layerBgImg.src = bgImg ? bgImg.src : `assets/Nen/${anhNen}`;
            this.layerBgImg.style.display = 'block';
          }
        }

        if (nhanVat && bieuCam && nhanVat.trim() !== "" && bieuCam.trim() !== "") {
          const currentKey = `${nhanVat}/${bieuCam}`;
          const img = this.boDemNhanVat.get(currentKey);
          this.layerChar.src = img ? img.src : `assets/NhanVat/${currentKey}.png`;
          this.layerChar.style.display = 'block';
          if (!this.layerChar.classList.contains('character-talking')) {
            this.layerChar.classList.add('character-talking');
          }
        } else if (nhanVat === "") {
          this.layerChar.style.display = 'none';
          this.layerChar.classList.remove('character-talking');
        }

        if (anhHieuUng && anhHieuUng.trim() !== "") {
          const vfxImg = this.boDemHieuUng.get(anhHieuUng);
          this.layerVfx.src = vfxImg ? vfxImg.src : `assets/HieuUng/${anhHieuUng}`;
          this.layerVfx.style.display = 'block';
        } else {
          this.layerVfx.style.display = 'none';
        }

        if (amThanhNen && amThanhNen.trim() !== "") {
          const bgmPath = `assets/AmThanh/Nen/${amThanhNen}`;
          if (!this.audioBgm.src.includes(amThanhNen)) {
            this.audioBgm.src = bgmPath;
            this.audioBgm.loop = true;
            this.audioBgm.play().catch(() => {});
          }
        }

        if (amThanhHieuUng && amThanhHieuUng.trim() !== "") {
          this.audioSfx.src = `assets/AmThanh/HieuUng/${amThanhHieuUng}`;
          this.audioSfx.play().catch(() => {});
        }

        let thoiGianWait = 1.0;
        if (noiDung) {
          this.hienLoiThoai(nhanVat, noiDung);
          thoiGianWait = this.docVanBanBangTTS(nhanVat, noiDung);
        }

        let elapsed = 0;
        const interval = 100;
        while (elapsed < thoiGianWait * 1000) {
          if (!this.dangChay) break;
          while (this.dangTamDung) {
            await this.sleep(100);
            if (!this.dangChay) break;
          }
          await this.sleep(interval);
          elapsed += interval;
        }
      }

      docVanBanBangTTS(nhanVat, text) {
        if (!text) return 0;
        if (this.ttsSynth) {
          this.ttsSynth.cancel();

          const utterance = new SpeechSynthesisUtterance(text);
          const cfg = (nhanVat && this.cauHinhGiongNhanVat[nhanVat]) 
            ? this.cauHinhGiongNhanVat[nhanVat] 
            : { voiceIndex: 0, rate: 1.1, pitch: 1.0 };

          if (this.danhSachVoices.length > 0) {
            utterance.voice = this.danhSachVoices[cfg.voiceIndex] || this.danhSachVoices[0];
          }

          utterance.volume = this.ttsVolume;
          utterance.rate = cfg.rate;
          utterance.pitch = cfg.pitch;

          const wordsCount = text.split(/\s+/).length;
          let estimatedDuration = (wordsCount / 3.5) * (1 / cfg.rate);
          if (estimatedDuration < 1.2) estimatedDuration = 1.2;

          this.ttsSynth.speak(utterance);
          return estimatedDuration;
        }
        return 2.0;
      }

      hienLoiThoai(ten, noiDung) {
        this.dialogueCanvas.style.display = 'flex';
        if (ten && ten.trim() !== "") {
          this.speakerText.innerText = ten;
          this.speakerText.style.display = 'block';
        } else {
          this.speakerText.style.display = 'none';
        }

        let idx = 0;
        this.dialogueText.innerText = '';
        clearInterval(this.hienChuInterval);
        
        const speed = (this.duLieu ? this.duLieu.toc_do_go_chu : 0.03) * 1000;
        this.hienChuInterval = setInterval(() => {
          if (!this.dangTamDung && this.dangChay) {
            if (idx < noiDung.length) {
              this.dialogueText.innerText += noiDung.charAt(idx);
              idx++;
            } else {
              clearInterval(this.hienChuInterval);
            }
          }
        }, speed);
      }

      xoaChuKhongAnCanvas() {
        clearInterval(this.hienChuInterval);
        this.dialogueText.innerText = '';
        this.speakerText.innerText = '';
      }

      xoaChu() {
        this.xoaChuKhongAnCanvas();
        this.dialogueCanvas.style.display = 'none';
      }

      dung() {
        this.dangChay = false;
        this.dangTamDung = false;
        document.getElementById('btn-pause').style.display = 'none';
        document.getElementById('btn-pause').innerText = "⏸ Tạm dừng";
        clearInterval(this.hienChuInterval);
        if (this.ttsSynth) this.ttsSynth.cancel();
        this.audioBgm.pause();
        this.audioSfx.pause();
        this.layerBgVideo.pause();
        this.xoaChu();
        this.layerBgImg.style.display = 'none';
        this.layerBgVideo.style.display = 'none';
        this.layerChar.style.display = 'none';
        this.layerChar.classList.remove('character-talking');
        this.layerVfx.style.display = 'none';
      }

      sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }
    }

    const trinhPhat = new TrinhPhatKichBanWeb();
  </script>
